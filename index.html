<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Northwind Ledger - a fragmentation-aware billing ledger for invoices, GST/TDS, payments, reconciliation and month-end close." />
<meta name="theme-color" content="#101322" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101322'/%3E%3Cpath d='M20 46V18h6l12 17V18h6v28h-6L26 29v17z' fill='%237c9bff'/%3E%3C/svg%3E" />
<title>Northwind Ledger - billing, tax and collections</title>
<style>
  :root {
    --bg: #f7f8fb; --panel: #ffffff; --ink: #101322; --muted: #5b6478;
    --line: #e5e8f0; --brand: #4f46e5; --brand-soft: #eef0ff;
    --good: #0f9d58; --good-soft: #e6f6ee; --warn: #b7791f; --warn-soft: #fdf5e6;
    --urgent: #d63b3b; --urgent-soft: #fdecec; --info: #2b6cb0; --info-soft: #e8f1fb;
    --radius: 14px; --shadow: 0 1px 2px rgba(16,19,34,.06), 0 8px 24px rgba(16,19,34,.05);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.45;
  }
  .app { display: grid; grid-template-columns: 244px 1fr; min-height: 100vh; }
  aside {
    background: #fff; border-right: 1px solid var(--line);
    padding: 20px 16px; position: sticky; top: 0; height: 100vh; overflow: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 18px; }
  .logo {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, var(--brand), #7c6cf5);
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px;
  }
  .brand b { font-size: 14.5px; letter-spacing: -.2px; display: block; }
  .brand span { font-size: 11.5px; color: var(--muted); }
  nav { display: grid; gap: 3px; }
  nav button {
    all: unset; cursor: pointer; padding: 9px 11px; border-radius: 9px;
    color: var(--muted); font-weight: 600; font-size: 13.5px; display: flex;
    align-items: center; justify-content: space-between; gap: 8px;
  }
  nav button:hover { background: #f2f4f9; color: var(--ink); }
  nav button.active { background: var(--brand-soft); color: var(--brand); }
  nav .count {
    font-size: 11px; background: #eef1f7; color: var(--muted); border-radius: 99px;
    padding: 1px 7px; font-weight: 700;
  }
  nav button.active .count { background: #dfe3ff; color: var(--brand); }
  .side-role { margin-top: 22px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fbfcfe; }
  .side-role label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
  .side-role select { margin-top: 7px; }
  .side-note { margin-top: 14px; font-size: 11.5px; color: var(--muted); padding: 0 4px; }
  main { padding: 26px 30px 60px; max-width: 1180px; }
  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.3px; }
  .sub { color: var(--muted); font-size: 13.5px; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card + .card { margin-top: 16px; }
  .card-h { padding: 15px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .card-h h2 { margin: 0; font-size: 14.5px; }
  .card-h .hint { font-size: 12px; color: var(--muted); }
  .card-b { padding: 16px 18px; }
  .grid { display: grid; gap: 14px; }
  .grid.kpi { grid-template-columns: repeat(4, 1fr); }
  .grid.two { grid-template-columns: 1.35fr 1fr; }
  @media (max-width: 980px) { .app { grid-template-columns: 1fr; } aside { position: static; height: auto; } .grid.kpi { grid-template-columns: repeat(2,1fr); } .grid.two { grid-template-columns: 1fr; } }
  .kpi { padding: 15px 16px; }
  .kpi .lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; }
  .kpi .val { font-size: 21px; font-weight: 800; margin-top: 6px; letter-spacing: -.4px; font-variant-numeric: tabular-nums; }
  .kpi .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; background: #fbfcfe; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { background: #f8f9fd; }
  tbody tr.sel { background: var(--brand-soft); }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 99px; }
  .b-good { background: var(--good-soft); color: var(--good); }
  .b-warn { background: var(--warn-soft); color: var(--warn); }
  .b-urgent { background: var(--urgent-soft); color: var(--urgent); }
  .b-info { background: var(--info-soft); color: var(--info); }
  .b-muted { background: #eef1f7; color: var(--muted); }
  .btn { all: unset; cursor: pointer; padding: 8px 13px; border-radius: 9px; font-weight: 650; font-size: 13px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .btn:hover { background: #f5f6fb; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: #4338ca; }
  .btn.ghost { border-color: transparent; color: var(--brand); }
  .btn.danger { color: var(--urgent); border-color: #f0c9c9; }
  .btn.sm { padding: 5px 10px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  input, select, textarea {
    font: inherit; color: inherit; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 9px; background: #fff; width: 100%; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  input.bad, select.bad, textarea.bad { border-color: var(--urgent); }
  label.f { display: block; font-size: 12px; font-weight: 650; color: var(--muted); margin-bottom: 5px; }
  .field { margin-bottom: 12px; }
  .field .err { color: var(--urgent); font-size: 12px; margin-top: 4px; }
  .field .ok { color: var(--good); font-size: 12px; margin-top: 4px; }
  .row { display: grid; gap: 12px; }
  .row.c2 { grid-template-columns: 1fr 1fr; }
  .row.c3 { grid-template-columns: 1fr 1fr 1fr; }
  .row.c4 { grid-template-columns: 2fr 1fr 1fr 1fr; }
  @media (max-width: 720px) { .row.c2, .row.c3, .row.c4 { grid-template-columns: 1fr; } }
  .reco { border-left: 4px solid var(--info); background: var(--info-soft); padding: 14px 16px; border-radius: 10px; }
  .reco.warn { border-color: var(--warn); background: var(--warn-soft); }
  .reco.urgent { border-color: var(--urgent); background: var(--urgent-soft); }
  .reco.good { border-color: var(--good); background: var(--good-soft); }
  .reco h3 { margin: 0 0 4px; font-size: 14.5px; }
  .reco p { margin: 0; color: #374151; font-size: 13px; }
  .reco .advice { margin-top: 8px; font-size: 12.5px; font-weight: 600; }
  .reco .meter { height: 6px; border-radius: 99px; background: rgba(0,0,0,.08); margin-top: 10px; overflow: hidden; }
  .reco .meter > i { display: block; height: 100%; background: currentColor; opacity: .75; }
  .hero .hero-amount { text-align: right; }
  .hero .hero-amount .lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; }
  .hero .hero-amount .val { font-size: 30px; font-weight: 800; letter-spacing: -.6px; font-variant-numeric: tabular-nums; }
  .lifecycle { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 14px; }
  .lc-step { display: flex; gap: 8px; align-items: flex-start; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; flex: 1 1 160px; opacity: .55; }
  .lc-step.done { opacity: 1; border-color: #bfe6cf; background: #f2fbf6; }
  .lc-dot { width: 9px; height: 9px; border-radius: 99px; background: var(--muted); margin-top: 5px; flex: none; }
  .lc-step.done .lc-dot { background: var(--good); }
  .lc-step b { font-size: 12.5px; }
  .caveat { background: #fff8f0; border: 1px solid #f3e0c7; color: #7a4e12; padding: 12px 14px; border-radius: 10px; font-size: 12.5px; }
  .explain { background: #f6f8ff; border: 1px solid #dbe4ff; color: #27346b; padding: 10px 12px; border-radius: 10px; font-size: 12.5px; margin-top: 10px; }
  .caveat ul { margin: 6px 0 0; padding-left: 18px; }
  .caveat li { margin: 3px 0; }
  .flag { border: 1px solid #f0c9c9; background: #fff6f6; border-radius: 10px; padding: 10px 12px; margin-top: 8px; font-size: 12.5px; color: #8a1f1f; }
  .flag.bad { }
  .okline { border: 1px solid #bfe6cf; background: #f2fbf6; border-radius: 10px; padding: 10px 12px; font-size: 12.5px; color: #166534; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .pill-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .modal-wrap { position: fixed; inset: 0; background: rgba(16,19,34,.42); display: grid; place-items: center; padding: 20px; z-index: 50; overflow: auto; }
  .modal { background: #fff; border-radius: 16px; max-width: 880px; width: 100%; box-shadow: 0 30px 80px rgba(16,19,34,.3); max-height: 92vh; overflow: auto; }
  .modal-h { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: #fff; }
  .modal-b { padding: 20px; }
  .modal-f { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; position: sticky; bottom: 0; background: #fff; }
  .toast { position: fixed; bottom: 22px; right: 22px; z-index: 90; display: grid; gap: 8px; }
  .toast > div { background: #101322; color: #fff; padding: 11px 14px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); max-width: 360px; display: flex; align-items: center; gap: 10px; }
  .toast > div.err { background: var(--urgent); }
  .toast > div.ok { background: var(--good); }
  .toast-action { background: transparent; color: inherit; border: 1px solid rgba(255,255,255,.55); border-radius: 7px; padding: 3px 9px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .toast-action:hover { background: rgba(255,255,255,.14); }
  [role="dialog"]:focus { outline: none; }
  .subtle { font-size: 12px; color: var(--muted); }
  .steps { display: grid; gap: 8px; }
  .step { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
  .step .dot { width: 20px; height: 20px; border-radius: 99px; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #fff; background: #c3c9d6; flex: none; }
  .step.done .dot { background: var(--good); }
  .step.done { background: #f7fdfa; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { all: unset; cursor: pointer; padding: 7px 12px; font-size: 12.5px; font-weight: 650; color: var(--muted); }
  .seg button.on { background: var(--brand); color: #fff; }
  .empty { text-align: center; color: var(--muted); padding: 30px; font-size: 13px; }
  .ledger td, .ledger th { font-size: 12.5px; }
  .tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: #eef1f7; color: var(--muted); }
  .nav-group-h { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 12px 10px 4px; }
  .app.rail-collapsed .nav-group-h { display: none; }
  .attn { border-left: 3px solid currentColor; }
  .why { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  details.caveat summary { cursor: pointer; font-weight: 650; }
  details.caveat[open] summary { margin-bottom: 8px; }
</style>
<style id="aurora">
  /* Aurora Ledger - token + theme layer (overrides the base stylesheet) */
  :root {
    --bg: #f5f7fc; --panel: #ffffff; --surface-2: #eef1f8; --ink: #0e1526; --muted: #616e88;
    --line: #e3e8f1; --brand: #4f46e5; --brand-2: #7c6cf5; --brand-soft: #eef0ff;
    --accent: #f59e0b; --good: #0f9d58; --warn: #b7791f; --urgent: #d63b3b; --info: #2b6cb0;
    --radius: 16px; --radius-sm: 10px;
    --shadow: 0 1px 2px rgba(15,23,42,.05), 0 12px 34px -20px rgba(15,23,42,.30);
    --ring: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  [data-theme="dark"] {
    --bg: #0a0f1e; --panel: #121a2e; --surface-2: #1a2338; --ink: #e9eefb; --muted: #98a5c4;
    --line: #26314c; --brand: #8b8cf9; --brand-2: #a78bfa; --brand-soft: #1e2545;
    --accent: #fbbf24; --good: #34d399; --warn: #fbbf24; --urgent: #f87171; --info: #60a5fa;
    --good-soft: #0f2e26; --warn-soft: #33280d; --urgent-soft: #3a1d1d; --info-soft: #132a44;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 18px 44px -22px rgba(0,0,0,.85);
  }
  body {
    background:
      radial-gradient(1200px 500px at 110% -10%, color-mix(in srgb, var(--brand) 9%, transparent), transparent 60%),
      radial-gradient(900px 420px at -10% 0%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 55%),
      var(--bg);
    background-attachment: fixed;
  }
  .app { grid-template-columns: 252px 1fr; transition: grid-template-columns .2s ease; }
  .app.rail-collapsed { grid-template-columns: 68px 1fr; }
  .app.rail-collapsed aside .brand > div:last-child,
  .app.rail-collapsed aside nav button .lbl,
  .app.rail-collapsed aside .side-role,
  .app.rail-collapsed aside .side-note { display: none; }
  nav button .abbr { display: none; }
  .app.rail-collapsed nav button { justify-content: center; }
  .app.rail-collapsed nav button .abbr {
    display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px;
    background: var(--surface-2); font: 700 10px var(--mono); color: var(--muted);
  }
  .app.rail-collapsed nav button.active .abbr { background: var(--brand-soft); color: var(--brand); }
  aside { background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(10px); }
  .logo { background: linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow: 0 6px 16px -6px var(--brand); }
  nav button { position: relative; }
  nav button.active::before {
    content: ""; position: absolute; left: -16px; top: 8px; bottom: 8px; width: 3px;
    border-radius: 0 3px 3px 0; background: var(--brand);
  }
  .icon-btn {
    all: unset; cursor: pointer; width: 34px; height: 34px; display: grid; place-items: center;
    border-radius: 9px; border: 1px solid var(--line); color: var(--muted); background: var(--panel);
  }
  .icon-btn:hover { color: var(--ink); background: var(--surface-2); }
  :focus-visible { outline: none; box-shadow: var(--ring); border-radius: 8px; }
  .skip-link { position: absolute; left: -9999px; top: 8px; z-index: 100; background: var(--surface); color: var(--ink); padding: 10px 14px; border-radius: 10px; box-shadow: var(--ring); text-decoration: none; font-weight: 600; }
  .skip-link:focus { left: 12px; }
  [aria-busy="true"] { opacity: .7; }
  .topbar { position: sticky; top: 0; z-index: 20; padding: 14px 0 12px; margin-bottom: 16px;
    background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(10px); }
  .search-btn {
    all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; min-width: 220px;
    padding: 8px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--muted);
  }
  .search-btn:hover { border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); color: var(--ink); }
  .search-btn kbd { margin-left: auto; font: 600 11px var(--mono); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
  .kpi { position: relative; overflow: hidden; }
  .kpi::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: linear-gradient(var(--brand), var(--brand-2)); opacity: .85; }
  .card { transition: box-shadow .2s ease, border-color .2s ease; }
  .card:hover { border-color: color-mix(in srgb, var(--brand) 24%, var(--line)); }
  th { position: sticky; top: 0; z-index: 1; background: color-mix(in srgb, var(--surface-2) 70%, var(--panel)); backdrop-filter: blur(6px); }
  thead th { border-bottom: 1px solid var(--line); }
  .badge { white-space: nowrap; }
  .b-brand { background: var(--brand-soft); color: var(--brand); }
  .meter { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--brand-2)); }

  /* Drawer (right side) */
  .drawer-wrap { position: fixed; inset: 0; background: rgba(8,12,24,.5); z-index: 60; display: flex; justify-content: flex-end; }
  .drawer { width: min(720px, 100%); height: 100%; background: var(--panel); border-left: 1px solid var(--line);
    box-shadow: -30px 0 80px -30px rgba(0,0,0,.5); display: flex; flex-direction: column; animation: slidein .2s ease; }
  @keyframes slidein { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
  .drawer-h { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .drawer-h h2 { margin: 0; font-size: 16px; }
  .drawer-b { padding: 20px; overflow: auto; flex: 1; }
  .drawer-f { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }
  @media (prefers-reduced-motion: reduce) { .drawer { animation: none; } }

  /* Command palette */
  .palette-wrap { position: fixed; inset: 0; background: rgba(8,12,24,.5); z-index: 70; display: grid; place-items: start center; padding: 12vh 16px 16px; }
  .palette { width: min(620px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .palette input { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 15px 18px; font-size: 15px; }
  .palette input:focus { box-shadow: none; }
  .palette-list { max-height: 46vh; overflow: auto; padding: 6px; }
  .palette-item { all: unset; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 9px; font-size: 13.5px; width: 100%; }
  .palette-item:hover, .palette-item.on { background: var(--brand-soft); color: var(--brand); }
  .palette-item .kind { color: var(--muted); font-size: 11.5px; }

  /* Dark-mode repairs for a few hard-coded light surfaces in the base sheet */
  [data-theme="dark"] .reco p { color: var(--muted) !important; }
  [data-theme="dark"] .reco h3 { color: var(--ink) !important; }
  [data-theme="dark"] .caveat { background: var(--warn-soft) !important; border-color: color-mix(in srgb, var(--warn) 45%, transparent) !important; color: var(--warn) !important; }
  [data-theme="dark"] .flag { background: var(--urgent-soft) !important; border-color: color-mix(in srgb, var(--urgent) 45%, transparent) !important; color: var(--urgent) !important; }
  [data-theme="dark"] .okline { background: var(--good-soft) !important; border-color: color-mix(in srgb, var(--good) 45%, transparent) !important; color: var(--good) !important; }
  [data-theme="dark"] .muted, [data-theme="dark"] .subtle { color: var(--muted); }
  [data-theme="dark"] .toast > div { background: var(--surface-2); color: var(--ink); }
  [data-theme="dark"] .modal, [data-theme="dark"] .modal-h, [data-theme="dark"] .modal-f { background: var(--panel); color: var(--ink); }
  [data-theme="dark"] input, [data-theme="dark"] select, [data-theme="dark"] textarea { background: var(--surface-2); color: var(--ink); }
  [data-theme="dark"] .btn { background: var(--panel); color: var(--ink); }
  [data-theme="dark"] .btn:hover { background: var(--surface-2); }
  [data-theme="dark"] aside { background: color-mix(in srgb, var(--panel) 92%, transparent); }

  /* Responsive */
  @media (max-width: 1024px) {
    .app, .app.rail-collapsed { grid-template-columns: 1fr; }
    aside { position: static; height: auto; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-right: 0; border-bottom: 1px solid var(--line); }
    aside .brand { padding: 0 8px 0 0; }

const TERMS = {
  ledger: { business: "Money In & Out", accounting: "Billing ledger" },
  receivables: { business: "Money customers owe you", accounting: "Accounts Receivable" },
  gstOutput: { business: "GST collected", accounting: "GST Output" },

  recurring: { business: "Recurring bills", accounting: "Recurring" },
  commitments: { business: "Upcoming commitments", accounting: "Commitments" },
  close: { business: "Close this month", accounting: "Month-end close" },
  reports: { business: "Business reports", accounting: "Reports" },
  queue: { business: "Ready to review", accounting: "Preview queue" },
};
function term(key) {
  const t = TERMS[key];
  if (!t) return key;
  return state.settings.accountingDetail ? t.accounting : t.business;
}
function setAccountingDetail(on) {
  state.settings.accountingDetail = !!on;

// Regime-aware tax presentation (GST splits; other regimes show one tax line).
function taxHeadCells() {
  return isGstRegime()
    ? `<th class="num">CGST</th><th class="num">SGST</th><th class="num">IGST</th>`
    : `<th class="num">${esc(taxNoun())}</th>`;
}
function taxBodyCells(t) {
  return isGstRegime()
    ? `<td class="num">${p(t.cgstPaise)}</td><td class="num">${p(t.sgstPaise)}</td><td class="num">${p(t.igstPaise)}</td>`
    : `<td class="num">${p(t.totalTaxPaise ?? t.gstPaise)}</td>`;
}
const TAX_TREATMENTS = { standard: "Standard", reverse_charge: "Reverse charge", exempt: "Exempt", zero_rated: "Zero-rated" };
const taxTreatmentLabel = (v) => TAX_TREATMENTS[v] || "Standard";
function baseEquivalent(inv) {
  const cur = inv.currency || state.settings.currency;
  const base = state.settings.baseCurrency || cur;
  const amt = (inv.totals && inv.totals.totalPaise) || 0;
  if (cur === base || !inv.fxRate) return null;
  const rate = Number(inv.fxRate);
  if (!isFinite(rate) || rate <= 0) return null;
  return Math.round(amt * rate);
}

function taxRows(t) {
  if (!isGstRegime()) return `<tr><td>${esc(taxNoun())}</td><td class="num">${p(t.totalTaxPaise ?? t.gstPaise)}</td></tr>`;
  return `${t.cgstPaise ? `<tr><td>CGST</td><td class="num">${p(t.cgstPaise)}</td></tr>` : ""}${t.sgstPaise ? `<tr><td>SGST</td><td class="num">${p(t.sgstPaise)}</td></tr>` : ""}${t.igstPaise ? `<tr><td>IGST (inter-state)</td><td class="num">${p(t.igstPaise)}</td></tr>` : ""}`;
}

  const inP = (d) => d && d.slice(0, 7) === state.period;

const planLimit = () => planById(state.settings.plan).limit;

// Defensive load: a workspace saved by an older or interrupted build can hold
// records missing required fields. One such record would otherwise throw while
// rendering and blank the whole app, so quarantine them and keep going.
function repairWorkspace() {
  state.quarantine = Array.isArray(state.quarantine) ? state.quarantine : [];
  if (!Array.isArray(state.invoices)) state.invoices = [];
  const isInvoice = (i) => i && typeof i === "object" && Array.isArray(i.lineItems) && i.totals && typeof i.totals.totalPaise === "number" && typeof i.clientName === "string" && typeof i.date === "string";
  const badInv = state.invoices.filter((i) => !isInvoice(i));
  for (const i of badInv) state.quarantine.push({ at: todayISO, kind: "invoice", reason: "Missing required fields", record: i });
  if (badInv.length) state.invoices = state.invoices.filter(isInvoice);
  return badInv.length;
}

async function boot() {

  if (__serverMode && storeAdapter) {
    try { const loaded = await storeAdapter.loadWorkspace(); if (loaded && loaded.state) saved = loaded.state; } catch (e) { saved = null; }
  }
  if (!saved) { try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) { saved = null; } }
  if (saved && Array.isArray(saved.invoices)) {
    Object.assign(state, saved);
    state.settings = { regimeId: "IN_GST", currency: "INR", country: "IN", plan: "free", onboarded: false, theme: "light", baseCurrency: "INR", hardLock: false, requireApproval: false, ...(saved.settings || {}) };
    state.ui = { railCollapsed: false, ledgerDetail: false, onboardingDismissed: false, ...(saved.ui || {}) };

    state.coa = Array.isArray(state.coa) && state.coa.length ? state.coa : defaultChartOfAccounts();
    for (const k of ["journals", "bankAccounts", "bankTxns", "expenses", "vendors", "bills", "billPayments", "subscriptions", "periods"]) {
      state[k] = Array.isArray(state[k]) ? state[k] : [];
    }
    state.invSelection = [];
    const ids = [...state.invoices, ...state.payments, ...state.commitments, ...state.clients, ...(state.creditNotes || []), ...(state.recurring || []), ...(state.attachments || []), ...(state.reminders || [])]
      .map((o) => String(o.id || "")).join(",").match(/\d+/g) || [];
    if (ids.length) uid = Math.max(1000, ...ids.map(Number));
  } else {

  if (!state.period) state.period = PERIOD;
  if (repaired) { try { saveState(); } catch (e) { /* keep going */ } toast(`${repaired} damaged record${repaired === 1 ? "" : "s"} moved to quarantine`, "err"); }
}

function paymentTotalsFor(invoiceId) {
  const rows = paymentsFor(invoiceId);
  return {
    paidPaise: rows.reduce((a, r) => a + r.amountPaise, 0),
    tdsPaise: rows.reduce((a, r) => a + r.tdsDeductedPaise, 0),
  };
}
function openBalance(inv) {
  const t = paymentTotalsFor(inv.id);
  return Math.max(0, inv.totals.totalPaise - t.paidPaise - t.tdsPaise);
}
function clientRecommendation(clientId) {
  const invs = invoicesForClient(clientId);
  const sum = invs.reduce((a, i) => a + i.totals.totalPaise, 0);
  const avg = invs.length ? Math.round(sum / invs.length) : 0;
  return recommendFragmentation({ invoiceCount: invs.length, avgInvoicePaise: avg, role: state.role, clientName: client(clientId)?.name || "client" });
}

function buildInvoiceJournal(inv) {
  if (isVoid(inv) || !isBaseCurrency(inv)) return null;
  const tax = taxTotalOf(inv.totals);
  return { id: "gj_" + inv.id, date: inv.date, ref: inv.number, memo: inv.description || "Sales invoice", source: "invoice", sourceId: inv.id, createdBy: state.role || "owner",
    lines: [jline("1100", inv.totals.totalPaise), jline("4000", 0, inv.totals.taxablePaise), ...(tax > 0 ? [jline("2100", 0, tax)] : [])] };
}
function buildCreditNoteJournal(cn) {
  return { id: "gj_" + cn.id, date: cn.date, ref: cn.number, memo: cn.reason || "Credit note", source: "credit_note", sourceId: cn.id, createdBy: state.role || "owner",
    lines: [jline("4000", cn.taxablePaise || 0), ...((cn.gstPaise || 0) > 0 ? [jline("2100", cn.gstPaise)] : []), jline("1100", 0, cn.totalPaise || 0)] };
}
function buildPaymentJournal(pay) {
  const tds = pay.tdsDeductedPaise || 0;
  return { id: "gj_" + pay.id, date: pay.date, ref: pay.invoiceNumber || pay.reference || "Receipt", memo: "Customer receipt", source: "payment", sourceId: pay.id, createdBy: state.role || "owner",
    lines: [jline("1010", pay.amountPaise), ...(tds > 0 ? [jline("1200", tds)] : []), jline("1100", 0, pay.amountPaise + tds)] };
}
function buildExpenseJournal(ex) {
  const from = cashCode(ex.paidFrom);
  return { id: "gj_" + ex.id, date: ex.date, ref: ex.reference || "Expense", memo: ex.vendorName || ex.category, source: "expense", sourceId: ex.id, createdBy: state.role || "owner",
    lines: [jline(expenseAccountFor(ex.category), ex.netPaise), ...((ex.gstPaise || 0) > 0 ? [jline("1200", ex.gstPaise)] : []), jline(from, 0, ex.totalPaise)] };
}
function buildBillJournal(bill) {
  return { id: "gj_" + bill.id, date: bill.date, ref: bill.number, memo: bill.vendorName || "Purchase bill", source: "bill", sourceId: bill.id, createdBy: state.role || "owner",
    lines: [jline(expenseAccountFor(bill.category), bill.netPaise), ...((bill.gstPaise || 0) > 0 ? [jline("1200", bill.gstPaise)] : []), jline("2000", 0, bill.totalPaise)] };
}
function buildBillPaymentJournal(bp) {
  return { id: "gj_" + bp.id, date: bp.date, ref: bp.reference || "Bill payment", memo: "Vendor payment", source: "bill_payment", sourceId: bp.id, createdBy: state.role || "owner",
    lines: [jline("2000", bp.amountPaise), jline("1010", 0, bp.amountPaise)] };
}

function generatedJournals() {
  const out = [];
  for (const inv of state.invoices) { const j = buildInvoiceJournal(inv); if (j) out.push(j); }
  for (const cn of state.creditNotes || []) out.push(buildCreditNoteJournal(cn));
  for (const pay of state.payments) out.push(buildPaymentJournal(pay));
  for (const ex of state.expenses || []) out.push(buildExpenseJournal(ex));
  for (const b of state.bills || []) out.push(buildBillJournal(b));
  for (const bp of state.billPayments || []) out.push(buildBillPaymentJournal(bp));
  return out;
}
const isPendingJournal = (j) => !!(j && j.approval && j.approval.status === "pending");
const isPostedJournal = (j) => !j.approval || j.approval.status === "approved";
function requiresApproval(kind) { return state.settings.requireApproval === true && kind === "journal"; }

function approveJournal(id) {

  j.approval = { status: "approved", by: state.role || "owner", at: new Date().toISOString(), note: j.approval.note || "" };
  recordChange("journal.approve", j.ref || j.id, null, j, { reason: "Approved and posted" });

}
function rejectJournal(id) {

  j.approval = { status: "rejected", by: state.role || "owner", at: new Date().toISOString(), note: j.approval.note || "" };

}
function allJournals() {
  const manual = (state.journals || []).filter((j) => j && Array.isArray(j.lines) && j.lines.length && isPostedJournal(j));
  return manual.concat(generatedJournals());
}

// --- Finance command-center figures (all exact minor units) ----------------
function bankBalance(acct) { return (acct.openingPaise || 0) + state.bankTxns.filter((t) => t.accountId === acct.id).reduce((a, t) => a + t.amountPaise, 0); }
function cashOnHand() { return (state.bankAccounts || []).reduce((a, b) => a + bankBalance(b), 0); }
function inputTaxPaise() {
  const ex = (state.expenses || []).reduce((a, x) => a + (x.gstPaise || 0), 0);
  const bills = (state.bills || []).reduce((a, b) => a + (b.gstPaise || 0), 0);
  const tdsCredit = state.payments.reduce((a, x) => a + (x.tdsDeductedPaise || 0), 0);
  return ex + bills + tdsCredit;
}
function outputTaxPaise() { return taxSnapshot().totalTaxPaise; }
function netTaxPaise() { return outputTaxPaise() - inputTaxPaise(); }
function payablesPaise() { return (state.bills || []).reduce((a, b) => a + billOpen(b), 0); }
function billPaid(bill) { return (state.billPayments || []).filter((p) => p.billId === bill.id).reduce((a, p) => a + p.amountPaise, 0); }
function billOpen(bill) { return Math.max(0, bill.totalPaise - billPaid(bill)); }
function periodExpenses(from = state.period + "-01", to = state.period + "-31") {
  return (state.expenses || []).filter((e) => e.date >= from && e.date <= to);
}
function vendorSpend(vendorId, from, to) {
  const ex = (state.expenses || []).filter((e) => e.vendorId === vendorId && (!from || e.date >= from) && (!to || e.date <= to));
  const bills = (state.bills || []).filter((b) => b.vendorId === vendorId && (!from || b.date >= from) && (!to || b.date <= to));
  return ex.reduce((a, e) => a + e.netPaise, 0) + bills.reduce((a, b) => a + b.netPaise, 0);
}
function financeKpis() {
  const from = state.period + "-01", to = state.period + "-31";
  const pl = profitAndLoss(allJournals(), state.coa, { from, to });
  const cf = cashFlow(allJournals(), state.coa, { from, to });
  const ts = taxSnapshot();
  const ar = state.invoices.filter((i) => !isVoid(i)).reduce((a, i) => a + openBalance(i), 0);
  const ap = payablesPaise();
  return {
    cash: cashOnHand(), ar, ap, revenue: ts.taxablePaise, outputTax: ts.totalTaxPaise,
    inputTax: inputTaxPaise(), netTax: netTaxPaise(),
    expenses: pl.expensePaise + pl.cogsPaise, profit: pl.netProfitPaise,
    netCash: cf.netChangePaise, operating: cf.operatingPaise, investing: cf.investingPaise, financing: cf.financingPaise,
  };
}

// 30/60/90 cash forecast from expected collections, bills due and subscriptions.
function cashForecast() {
  const horizon = (days) => {
    const end = new Date(new Date(todayISO + "T00:00:00Z").getTime() + days * 86400000).toISOString().slice(0, 10);
    const addMonths = (ym, n) => { const d = new Date(ym + "-01T00:00:00Z"); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 7); };
    let inflow = 0, outflow = 0;
    for (const inv of state.invoices) {
      if (isVoid(inv)) continue;
      const bal = openBalance(inv);
      if (bal <= 0) continue;
      const expected = inv.dueDate || inv.date;
      if (expected <= end) inflow += bal;
    }
    for (const b of state.bills || []) {
      const bal = billOpen(b);
      if (bal <= 0) continue;
      if ((b.dueDate || b.date) <= end) outflow += bal;
    }
    for (const s of state.subscriptions || []) {
      if (s.active === false) continue;
      for (let m = 1; m <= Math.ceil(days / 30); m++) {
        const d = addMonths(state.period, m - 1) + "-" + String(s.dayOfMonth || 1).padStart(2, "0");
        if (d <= end) outflow += s.amountPaise;
      }
    }
    return { days, inflowPaise: inflow, outflowPaise: outflow, netPaise: inflow - outflow };
  };
  return [horizon(30), horizon(60), horizon(90)];
}

function toast(msg, kind = "", opts = {}) {
  const d = document.createElement("div");
  d.className = kind;
  if (opts && opts.action && typeof opts.action.onAction === "function") {
    const label = document.createElement("span");
    label.textContent = msg;
    const btn = document.createElement("button");
    btn.className = "toast-action"; btn.type = "button"; btn.textContent = opts.action.label || "Undo";
    btn.onclick = () => { try { opts.action.onAction(); } finally { d.remove(); } };
    d.appendChild(label); d.appendChild(btn);
    setTimeout(() => d.remove(), 8000);
  } else {
    d.textContent = msg;
    setTimeout(() => d.remove(), 4200);
  }
  el("toast").appendChild(d);
}

// ---- Modal focus lifecycle ------------------------------------------------
let __lastFocus = null;
let __modalClose = null;
function focusableIn(root) {
  if (!root || typeof root.querySelectorAll !== "function") return [];
  return Array.from(root.querySelectorAll("a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex='-1'])"))
    .filter((n) => !n.hidden);
}
function beginModal() {
  const a = document.activeElement;
  if (!a || a === document.body) return;
  const root = el("modalRoot");
  if (root && typeof root.contains === "function" && root.contains(a)) return;
  __lastFocus = a;
}
function endModal() {
  const root = el("modalRoot");
  if (root) root.innerHTML = "";
  const back = __lastFocus; __lastFocus = null; __modalClose = null;
  const connected = back && (typeof document.contains !== "function" || document.contains(back));
  try { if (connected && typeof back.focus === "function") back.focus(); } catch (e) { /* focus restore is best-effort */ }
}
function focusDialog() {
  if (typeof document.querySelector !== "function") return;
  const node = document.querySelector("#modalRoot [role='dialog']");
  if (node && typeof node.focus === "function") node.focus();
}
function handleModalKeys(e) {
  const root = el("modalRoot");
  if (!root || !root.innerHTML.trim()) return;
  if (e.defaultPrevented) return;
  if (e.key === "Escape") { if (__modalClose) { e.preventDefault(); __modalClose(); } return; }
  if (e.key !== "Tab") return;
  const items = focusableIn(root);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

// ---- Confirmation + undo --------------------------------------------------
function confirmAction({ title, body = "", confirmLabel = "Confirm", cancelLabel = "Cancel", danger = true, onConfirm }) {
  beginModal();
  el("modalRoot").innerHTML = `
    <div class="modal-wrap" id="cfw">
      <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" tabindex="-1" style="max-width:460px">
        <div class="modal-h"><h2 style="margin:0;font-size:16px">${esc(title)}</h2><button class="icon-btn" id="cf_x" aria-label="Close">x</button></div>
        <div class="modal-b"><div class="subtle" style="font-size:13px;line-height:1.55">${body}</div></div>
        <div class="modal-f">
          <button class="btn" id="cf_cancel">${esc(cancelLabel)}</button>
          <button class="btn ${danger ? "danger" : "primary"}" id="cf_ok">${esc(confirmLabel)}</button>
        </div>
      </div>
    </div>`;
  const close = () => endModal();
  __modalClose = close;
  el("cf_x").onclick = close;
  el("cf_cancel").onclick = close;
  el("cfw").onclick = (e) => { if (e.target.id === "cfw") close(); };
  el("cf_ok").onclick = () => { const fn = onConfirm; close(); if (typeof fn === "function") fn(); };
  focusDialog();
}

// Typed-confirmation guard for high-impact, hard-to-undo actions. The action
// button stays disabled until the user types the exact phrase.
function guardDestructive({ title, body = "", confirmLabel = "Confirm", phrase, onConfirm }) {
  beginModal();
  el("modalRoot").innerHTML = `
    <div class="modal-wrap" id="gdw">
      <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" tabindex="-1" style="max-width:480px">
        <div class="modal-h"><h2 style="margin:0;font-size:16px">${esc(title)}</h2><button class="icon-btn" id="gd_x" aria-label="Close">x</button></div>
        <div class="modal-b">
          <div class="flag" style="font-size:13px;line-height:1.55">${body}</div>
          <div class="field" style="margin-top:12px"><label class="f">Type ${esc(phrase)} to confirm</label><input id="gd_phrase" autocomplete="off"></div>
        </div>
        <div class="modal-f">
          <button class="btn" id="gd_cancel">Cancel</button>
          <button class="btn danger" id="gd_ok" disabled>${esc(confirmLabel)}</button>
        </div>
      </div>
    </div>`;
  const close = () => endModal();
  __modalClose = close;
  el("gd_x").onclick = close;
  el("gd_cancel").onclick = close;
  el("gdw").onclick = (e) => { if (e.target.id === "gdw") close(); };
  el("gd_phrase").oninput = (e) => { el("gd_ok").disabled = e.target.value.trim() !== phrase; };
  el("gd_ok").onclick = () => { const fn = onConfirm; close(); if (typeof fn === "function") fn(); };
  focusDialog();
}

  const paint = () => {
    el("plist").innerHTML = filtered.map((it, i) => `<button class="palette-item ${i === active ? "on" : ""}" data-i="${i}"><span>${esc(it.label)}</span><span class="kind">${esc(it.kind)}</span></button>`).join("") || `<div class="empty">No matches</div>`;
    el("plist").querySelectorAll("button").forEach((b) => b.onclick = () => run(Number(b.dataset.i)));
  };
  const close = () => endModal();
  __modalClose = close;
  const run = (i) => { const it = filtered[i]; close(); if (it) it.run(); };
  input.oninput = () => { const q = input.value.toLowerCase(); filtered = items.filter((it) => it.label.toLowerCase().includes(q)); active = 0; paint(); };
  input.onkeydown = (e) => {
    if (e.key === "ArrowDown") { active = Math.min(active + 1, filtered.length - 1); paint(); }

  paint();
  if (typeof input.focus === "function") input.focus();
}

const AUDIT_FIELDS = ["number", "clientName", "clientId", "date", "dueDate", "status", "void", "currency", "amountPaise", "totalPaise", "netPaise", "gstPaise", "category", "vendorName", "vendorId", "description", "memo", "ref", "method", "reference", "notes", "name", "email", "state", "gstin", "period", "active", "dayOfMonth", "ratePaise", "tdsSection"];

function auditSnapshot(obj) {
  if (!obj || typeof obj !== "object") return obj;
  const out = {};
  for (const k of AUDIT_FIELDS) if (obj[k] !== undefined) out[k] = obj[k];
  return out;
}

function changeDiff(before, after) {
  const b = auditSnapshot(before) || {}, a = auditSnapshot(after) || {};
  const keys = [...new Set([...Object.keys(b), ...Object.keys(a)])];
  return keys.filter((k) => JSON.stringify(b[k]) !== JSON.stringify(a[k])).map((k) => ({ field: k, from: b[k], to: a[k] }));
}

function logActivity(action, detail, opts = {}) {
  state.activity = state.activity || [];
  const entry = { at: new Date().toISOString(), action, detail, actor: (opts.actor || state.role || "owner") };
  if (opts.before !== undefined || opts.after !== undefined) {
    entry.changes = changeDiff(opts.before, opts.after);
  }
  if (opts.reason) entry.reason = opts.reason;
  state.activity.unshift(entry);
  state.activity = state.activity.slice(0, 200);
}

function recordChange(action, detail, before, after, opts = {}) {
  logActivity(action, detail, { ...opts, before, after });
}

function changeText(changes) {
  if (!changes || !changes.length) return "";
  return changes.map((c) => `${c.field}: ${JSON.stringify(c.from)} -> ${JSON.stringify(c.to)}`).join("; ");
}

const isVoid = (inv) => !!inv.void || inv.status === "void";

function invStatus(inv) {
  if (isVoid(inv)) return "void";
  const open = openBalance(inv);
  const paid = paymentTotalsFor(inv.id);
  if (open === 0 && (paid.paidPaise + paid.tdsPaise) > 0) return "paid";
  if (paid.paidPaise + paid.tdsPaise > 0) return inv.dueDate < todayISO ? "overdue" : "part-paid";
  if (inv.dueDate < todayISO) return "overdue";
  return inv.status || "issued";
}
const STATUS_TONE = { paid: "b-good", issued: "b-muted", sent: "b-info", draft: "b-muted", "part-paid": "b-warn", overdue: "b-urgent", void: "b-urgent" };
const statusBadge = (inv) => { const s = invStatus(inv); return `<span class="badge ${STATUS_TONE[s] || "b-muted"}">${esc(s)}</span>`; };

// ---- Needs action ---------------------------------------------------------

function actionItems() {
  const items = [];
  for (const inv of state.invoices) {
    if (isVoid(inv)) continue;
    const open = openBalance(inv);
    if (!open) continue;
    if (inv.dueDate < todayISO) {
      items.push({ tone: "urgent", view: "invoices", headline: `${inv.clientName} invoice unpaid`, title: `Overdue · ${inv.number} · ${inv.clientName}`, detail: `${p(open)} was due ${inv.dueDate}`, why: `Overdue since ${inv.dueDate}. Chase it or record a payment.`, actionLabel: "View invoice", amountPaise: open, due: inv.dueDate, inv });
    } else if (inv.dueDate <= addDays(todayISO, 7)) {
      items.push({ tone: "warn", view: "invoices", headline: `${inv.clientName} payment due soon`, title: `Due soon · ${inv.number} · ${inv.clientName}`, detail: `${p(open)} due ${inv.dueDate}`, why: "Due within the next 7 days. A reminder now avoids a late payment.", actionLabel: "View invoice", amountPaise: open, due: inv.dueDate, inv });
    }
    const pay = paymentsFor(inv.id);
    if (pay.length) {
      const t = inv.totals;
      const asym = detectPaymentAsymmetry({ invoice: { totalPaise: t.totalPaise, tdsPaise: t.tdsPaise }, payment: pay[pay.length - 1] });
      if (!asym.clean) {
        items.push({ tone: "urgent", view: "balance", headline: `Payment mismatch on ${inv.number}`, title: `Reconciliation · ${inv.number}`, detail: `${asym.flags.length} flag${asym.flags.length === 1 ? "" : "s"} on ${inv.clientName}`, why: "A receipt does not line up with the invoice. Check it before closing.", actionLabel: "Review", inv });
      }
    }
  }
  for (const c of state.clients) {
    const r = clientRecommendation(c.id);
    if (r.level === "urgent") {
      items.push({ tone: "warn", view: "queue", headline: `Consider consolidating ${c.name}`, title: `Consolidate ${c.name}`, detail: r.reason, why: "Many small invoices make the ledger harder to audit.", actionLabel: "Review", client: c });
    }
  }
  const close = monthEndClose({ period: state.period, invoices: state.invoices.map((i) => ({ date: i.date, totalPaise: i.totals.totalPaise })), payments: state.payments, role: state.role });
  const remaining = close.steps.filter((s) => !s.done).length;
  if (remaining) {
    items.push({ tone: "warn", view: "close", headline: "Close this month", title: `${remaining} month-end item${remaining === 1 ? "" : "s"} remaining`, detail: `${remaining} of ${close.steps.length} close steps remaining`, why: "Finish the month so the figures can be trusted.", actionLabel: "Continue" });
  }
  if (!state.settings.onboarded) {
    items.push({ tone: "warn", view: "settings", headline: "Confirm your tax profile", title: "Tax settings need confirmation", detail: "Business details and tax registration", why: "Tax figures depend on your current settings.", actionLabel: "Review settings" });
  }
  return items;
}

  return `<div class="card"><div class="card-h"><h2>Needs your attention</h2><span class="hint">${items.length} item${items.length === 1 ? "" : "s"}</span></div>
    <div class="card-b grid">${items.map((it) => `

function statementRows(clientId) {
  const invs = invoicesForClient(clientId);
  const rows = [];
  for (const inv of invs) {
    const t = inv.totals || {};
    rows.push({ date: inv.date, kind: "Invoice", ref: inv.number, debit: inv.taxablePaise ?? t.taxablePaise ?? 0, credit: 0, status: invStatus(inv) });
    if (isVoid(inv)) continue;
    for (const pay of paymentsFor(inv.id)) rows.push({ date: pay.date, kind: "Payment", ref: pay.reference || pay.method || "-", debit: 0, credit: asPaise(pay.amountPaise || 0) });
  }
  for (const cn of state.creditNotes) if (cn.clientId === clientId) rows.push({ date: cn.date, kind: "Credit note", ref: cn.number, debit: 0, credit: asPaise(cn.totalPaise ?? cn.amountPaise ?? 0) });
  return rows.sort((a, b) => String(a.date).localeCompare(String(b.date)));
}

function openStatement(clientId) {
  const c = client(clientId);
  if (!c) return;
  const rows = statementRows(clientId);
  const invs = invoicesForClient(clientId).filter((i) => !isVoid(i));
  const open = invs.reduce((a, i) => a + openBalance(i), 0);
  const billed = invs.reduce((a, i) => a + asPaise(i.totals?.payablePaise ?? i.totals?.totalPaise ?? 0), 0);
  const received = state.payments.filter((x) => x.clientId === clientId).reduce((a, x) => a + asPaise(x.amountPaise || 0), 0);
  const stmtBody = `
    <div class="row c3">${mini("Billed (net)", p(billed))}${mini("Received", p(received))}${mini("Outstanding", p(open))}</div>

    <table><thead><tr><th>Date</th><th>Type</th><th>Reference</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead>
      <tbody>${rows.map((r) => `<tr><td>${esc(r.date)}</td><td>${esc(r.kind)}</td><td class="mono">${esc(r.ref)}</td><td class="num">${r.debit ? p(r.debit) : "-"}</td><td class="num">${r.credit ? p(r.credit) : "-"}</td></tr>`).join("") || `<tr><td colspan="5" class="muted" style="padding:16px">No transactions yet.</td></tr>`}</tbody>
    </table>`;
  const close = openDrawer(`Statement · ${c.name}`, stmtBody, `<button class="btn" id="st_close">Close</button><button class="btn" id="st_print">Print statement</button>`);
  el("st_close").onclick = close;

}

// ---- Recurring templates --------------------------------------------------

const CADENCES = [["weekly", "Weekly"], ["fortnightly", "Fortnightly"], ["monthly", "Monthly"], ["quarterly", "Quarterly"], ["yearly", "Yearly"]];
const cadenceLabel = (c) => (CADENCES.find((x) => x[0] === c) || ["monthly", "Monthly"])[1];

function nextDateFor(dateIso, cadence) {
  const d = new Date(dateIso + "T00:00:00Z");
  if (cadence === "weekly") d.setUTCDate(d.getUTCDate() + 7);
  else if (cadence === "fortnightly") d.setUTCDate(d.getUTCDate() + 14);
  else d.setUTCMonth(d.getUTCMonth() + (cadence === "quarterly" ? 3 : cadence === "yearly" ? 12 : 1));
  return d.toISOString().slice(0, 10);
}

const recurringDue = (today = todayISO) => state.recurring.filter((r) => r.active !== false && r.nextDate <= today);
const dueRecurringCount = () => recurringDue().length;

function generateRecurring() {
  const due = recurringDue();
  if (!due.length) return 0;
  let n = 0;
  for (const r of due) {
    const c = client(r.clientId);
    const lines = [{ description: r.description, qty: 1, ratePaise: asPaise(r.ratePaise || 0), gstRate: r.gstRate || 0, hsnSac: "" }];
    const totals = computeInvoiceTotals({ supplierState: state.company.state, placeOfSupply: c?.state, regimeId: state.settings.regimeId, tdsSection: r.tdsSection || undefined, lineItems: lines });
    state.invoices.push({
      id: newId("inv"), number: `INV-REC-${state.nextInvoiceSeq++}`, clientId: r.clientId, clientName: c?.name || "",
      date: todayISO, dueDate: addDays(todayISO, 15), description: r.description, supplierState: state.company.state,
      placeOfSupply: c?.state, lineItems: lines, tdsSection: r.tdsSection || "", tdsCapture: {}, totals,
      currency: r.currency || state.settings.currency, taxTreatment: "standard", preview: true, status: "draft", fromRecurring: r.id,
    });
    r.nextDate = nextDateFor(r.nextDate, r.cadence);
    let guard = 0;
    while (r.nextDate <= todayISO && guard++ < 500) r.nextDate = nextDateFor(r.nextDate, r.cadence);
    n++;
  }
  logActivity("recurring.generate", `${n} invoice${n === 1 ? "" : "s"}`);
  saveState();
  return n;
}

  const due = dueRecurringCount();

// ---- Reconciliation assistant ---------------------------------------------

function openInvoicesForReconcile() {
  return state.invoices.filter((i) => !isVoid(i)).map((i) => ({
    id: i.id, number: i.number, clientId: i.clientId, clientName: i.clientName,
    openPaise: openBalance(i), totalPaise: i.totals.totalPaise, tdsPaise: i.totals.tdsPaise || 0,
    void: !!i.void, dueDate: i.dueDate,
  }));
}

function reconcileAssistant() {
  const payments = state.payments.map((p) => ({
    id: p.id, clientId: p.clientId, clientName: client(p.clientId)?.name || "",
    amountPaise: p.amountPaise, tdsDeductedPaise: p.tdsDeductedPaise || 0,
    date: p.date, reference: p.reference || "", invoiceId: p.invoiceId,
  }));
  const unmatched = payments.filter((p) => !p.invoiceId || !invoiceById(p.invoiceId) || isVoid(invoiceById(p.invoiceId)));
  return proposeMatches({ payments: unmatched, invoices: openInvoicesForReconcile() });
}

const confBadge = (c) => `<span class="badge ${c === "high" ? "b-good" : c === "medium" ? "b-warn" : "b-muted"}">${c} confidence</span>`;

function viewReconcile() {
  const { proposals, unmatched, openCount } = reconcileAssistant();

  const flagged = state.invoices
    .filter((i) => !isVoid(i))
    .map((i) => ({ inv: i, rec: reconcileInvoice({ invoice: { totalPaise: i.totals.totalPaise, tdsPaise: i.totals.tdsPaise }, payments: paymentsFor(i.id) }) }))

  return `
  <div class="card">
    <div class="card-h"><h2>Reconcile payments</h2><div class="toolbar">${high.length ? `<button class="btn primary" id="matchAllHigh">Match all ${high.length} high-confidence</button>` : ""}</div></div>
    <div class="card-b">
      <div class="row c3">
        ${mini("Suggestions", String(proposals.length))}${mini("Open invoices", String(openCount))}${mini("No plausible match", String(unmatched))}
      </div>
      <div class="subtle" style="margin-top:10px">This assistant looks at payments that are not yet linked to an invoice and proposes the closest open invoice. It never changes anything until you accept a match.</div>
      ${proposals.length ? `<table style="margin-top:12px">
        <thead><tr><th>Payment received</th><th class="num">Credit</th><th>Proposed invoice</th><th>Why</th><th></th></tr></thead>
        <tbody>${proposals.map((pr) => `<tr>
          <td>${esc(pr.date)}<div class="subtle">${esc(pr.clientName || "-")} · ${esc(pr.reference || "no reference")}</div></td>
          <td class="num">${p(pr.creditPaise)}</td>
          <td>${esc(pr.best.invoiceNumber)}<div class="subtle">${esc(pr.best.clientName)} · ${p(pr.best.openPaise)} open</div>${confBadge(pr.best.confidence)}</td>
          <td style="max-width:320px">${esc(pr.best.reason)}</td>
          <td><button class="btn sm primary" data-acceptmatch="${pr.paymentId}|${pr.best.invoiceId}">Accept match</button>
            ${(pr.alternates || []).map((a) => `<button class="btn sm" data-acceptmatch="${pr.paymentId}|${a.invoiceId}" title="${esc(a.reason)}">Use ${esc(a.invoiceNumber)}</button>`).join("")}</td>
        </tr>`).join("")}</tbody></table>`
        : `<div class="okline" style="margin-top:12px">Nothing to match right now. Record a payment and it will appear here if it is not linked to an invoice.</div>`}
    </div>
  </div>
  <div class="card">
    <div class="card-h"><h2>Receipts with no plausible match</h2><span class="hint">${unmatched} receipt${unmatched === 1 ? "" : "s"}</span></div>
    <div class="card-b">
      ${unmatchedPayments().length ? `<table><thead><tr><th>Date</th><th>Reference</th><th class="num">Amount</th><th>Assign to invoice</th></tr></thead>
        <tbody>${unmatchedPayments().map((x) => `<tr><td>${esc(x.date)}</td><td class="mono">${esc(x.reference || "-")}</td><td class="num">${p(x.amountPaise)}</td>
          <td><select data-manualmatch="${x.id}"><option value="">Choose an open invoice...</option>${state.invoices.filter((i) => !isVoid(i) && openBalance(i) > 0).map((i) => `<option value="${i.id}">${esc(i.number)} · ${esc(i.clientName)} · ${p(openBalance(i))} open</option>`).join("")}</select></td></tr>`).join("")}</tbody></table>
        <div class="subtle" style="margin-top:8px">Picking an invoice links the receipt to it immediately.</div>`
        : `<div class="okline">Every recorded receipt is linked to an invoice.</div>`}
    </div>
  </div>
  <div class="card">
    <div class="card-h"><h2>Receipts with a flag</h2><span class="hint">Already linked to an invoice, but the amounts do not fully reconcile</span></div>
    <div class="card-b">
      ${flagged.length ? flagged.map(({ inv, rec }) => `<div style="margin-bottom:12px">
        <div class="pill-row" style="justify-content:space-between"><b>${esc(inv.number)} · ${esc(inv.clientName)}</b><span class="badge b-urgent">${rec.flags.length} flag${rec.flags.length === 1 ? "" : "s"}</span></div>
        <div class="subtle">Received ${p(rec.receivedBankPaise)} bank + ${p(rec.deductedTdsPaise)} withheld against ${p(rec.totalPaise)} total; ${p(Math.max(0, rec.outstandingPaise))} outstanding.</div>
        ${rec.flags.map((f) => `<div class="flag">${esc(f.message)}</div>`).join("")}
      </div>`).join("") : `<div class="okline">Every linked receipt reconciles. Nothing flagged.</div>`}
    </div>
  </div>
  <div class="card"><div class="card-b">${caveatCollapsed()}</div></div>`;
}

function acceptAllHighConfidence() {
  const { proposals } = reconcileAssistant();
  const high = proposals.filter((p) => p.best && p.best.confidence === "high");
  if (!high.length) return toast("No high-confidence matches to accept", "");
  let n = 0;
  for (const pr of high) {
    const pay = state.payments.find((p) => p.id === pr.paymentId);
    const inv = invoiceById(pr.best.invoiceId);
    if (!pay || !inv) continue;
    pay.invoiceId = inv.id; pay.invoiceNumber = inv.number; pay.clientId = inv.clientId;
    if (openBalance(inv) === 0) inv.status = "paid";
    logActivity("payment.reconcile", `${pay.reference || pay.date} -> ${inv.number}`);
    n++;
  }
  saveState(); render();
  toast(`Matched ${n} receipt${n === 1 ? "" : "s"} to invoices`, "ok");
}

function acceptMatch(paymentId, invoiceId) {
  const pay = state.payments.find((p) => p.id === paymentId);
  const inv = invoiceById(invoiceId);
  if (!pay || !inv) return toast("That match is no longer available.", "err");
  pay.invoiceId = inv.id; pay.invoiceNumber = inv.number; pay.clientId = inv.clientId;
  if (openBalance(inv) === 0) inv.status = "paid";
  logActivity("payment.reconcile", `${pay.reference || pay.date} -> ${inv.number}`);
  saveState(); render(); toast(`Matched to ${inv.number}`, "ok");
}

let invFocusIndex = -1;
function handleInvoiceKeys(e) {
  if (state.view !== "invoices") return;
  if (el("modalRoot") && el("modalRoot").innerHTML.trim()) return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  const rows = filteredInvoices();
  if (!rows.length) return;
  if (e.key === "j" || e.key === "k") {
    invFocusIndex = e.key === "j" ? Math.min(rows.length - 1, invFocusIndex + 1) : Math.max(0, invFocusIndex - 1);
    const id = rows[invFocusIndex].id;
    if (typeof document.querySelector === "function") { const node = document.querySelector(`[data-inv="${id}"]`); node?.scrollIntoView?.({ block: "nearest" }); }
    render(); toast(`${invFocusIndex + 1} / ${rows.length}`, "");
    e.preventDefault();
  } else if (e.key === "x" && invFocusIndex >= 0) {
    toggleInvSelect(rows[invFocusIndex].id);
    e.preventDefault();
  } else if (e.key === "Escape" && (state.invSelection || []).length) {
    clearInvSelection();
    e.preventDefault();
  }
}

// ---- Attachments (documents attached to invoices and milestones) ----------

const ATTACH_MAX_BYTES = 2 * 1024 * 1024;
const ATTACH_MAX_TOTAL = 8 * 1024 * 1024;
const attachmentById = (id) => (state.attachments || []).find((a) => a.id === id);
const attachmentsForInvoice = (invoiceId) => (state.attachments || []).filter((a) => a.invoiceId === invoiceId);
const attachmentForMilestone = (commitmentId, idx) => (state.attachments || []).find((a) => a.commitmentId === commitmentId && Number(a.milestoneIndex) === Number(idx));
const totalAttachmentBytes = () => (state.attachments || []).reduce((a, x) => a + (Number(x.size) || 0), 0);
const filesize = (n) => (n >= 1024 * 1024 ? (n / (1024 * 1024)).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB");

function addAttachment(file, { invoiceId = "", commitmentId = "", milestoneIndex = null, expenseId = "", billId = "", kind = "other" } = {}) {
  if (!file) return Promise.resolve(null);
  if (file.size > ATTACH_MAX_BYTES) { toast("File is larger than 2 MB. Attachments live inside the workspace, so keep them small.", "err"); return Promise.resolve(null); }
  if (totalAttachmentBytes() + file.size > ATTACH_MAX_TOTAL) { toast("Workspace attachment limit (8 MB) reached. Remove some files first.", "err"); return Promise.resolve(null); }
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => {
      const rec = { id: newId("att"), name: file.name, type: file.type || "application/octet-stream", size: file.size, kind, invoiceId, commitmentId, milestoneIndex, expenseId, billId, addedAt: todayISO, dataUrl: String(reader.result) };
      state.attachments.push(rec);
      logActivity("attachment.add", `${file.name} (${kind})`);
      saveState();
      resolve(rec);
    };
    reader.onerror = () => { toast("Could not read that file.", "err"); resolve(null); };
    reader.readAsDataURL(file);
  });
}

const attachmentsForExpense = (id) => (state.attachments || []).filter((a) => a.expenseId && a.expenseId === id);
const attachmentsForBill = (id) => (state.attachments || []).filter((a) => a.billId && a.billId === id);

function removeAttachment(id) {
  const rec = attachmentById(id); if (!rec) return;
  const milestone = (rec.commitmentId && rec.milestoneIndex != null)
    ? (state.commitments.find((c) => c.id === rec.commitmentId) || {}).milestones?.[rec.milestoneIndex] : null;
  const evidence = milestone && milestone.evidence === rec.id;
  if (evidence) milestone.evidence = false;
  state.attachments = state.attachments.filter((a) => a.id !== id);
  logActivity("attachment.remove", rec.name);
  saveState(); render();
  toast(`${rec.name} removed`, "", { label: "Undo", onAction: () => {
    state.attachments.push(rec);
    if (evidence && milestone) milestone.evidence = rec.id;
    logActivity("attachment.restore", rec.name); saveState(); render(); toast("Attachment restored", "ok");
  } });
}

async function attachMilestoneEvidence(cmId, idx, file) {
  const cm = state.commitments.find((c) => c.id === cmId);
  if (!cm) return;
  const rec = await addAttachment(file, { commitmentId: cmId, milestoneIndex: idx, kind: "proof" });
  if (rec) { cm.milestones[idx].evidence = rec.id; saveState(); render(); toast("Evidence attached - accrual updated", "ok"); }
}

let pendingEvidence = null;

// ---- Collections: payment reminders ---------------------------------------

function daysOverdue(inv, today = todayISO) {
  return Math.floor((new Date(today + "T00:00:00Z") - new Date(inv.dueDate + "T00:00:00Z")) / 86400000);
}
function reminderStage(inv, today = todayISO) {
  const d = daysOverdue(inv, today);
  if (d > 14) return "final";
  if (d >= 1) return "firm";
  return "friendly";
}
function reminderDraft(inv, stage = reminderStage(inv)) {
  const open = openBalance(inv);
  const c = client(inv.clientId);
  const who = (c && c.name) || inv.clientName || "there";
  const amount = p(open);
  const days = daysOverdue(inv);
  const sig = state.company.name || "the team";
  if (stage === "firm") {
    return {
      subject: `Overdue: invoice ${inv.number} (${amount})`,
      body: `Hi ${who},\n\nInvoice ${inv.number} for ${amount} was due on ${inv.dueDate} and is now ${days} day${days === 1 ? "" : "s"} overdue.\n\nCould you confirm a payment date, or let me know if anything is blocking it? The invoice and any attached documents are available on request.\n\nThank you,\n${sig}`,
    };
  }
  if (stage === "final") {
    return {
      subject: `Final reminder: invoice ${inv.number} (${amount})`,
      body: `Hi ${who},\n\nThis is a final reminder for invoice ${inv.number} for ${amount}, which was due on ${inv.dueDate} (${days} days ago).\n\nPlease arrange payment within 7 days, or reply with a date that works so we can plan. If this has already been paid, please ignore this and accept our thanks.\n\nRegards,\n${sig}`,
    };
  }
  return {
    subject: `Reminder: invoice ${inv.number} (${amount}) due ${inv.dueDate}`,
    body: `Hi ${who},\n\nA quick reminder that invoice ${inv.number} for ${amount} is due on ${inv.dueDate}. No action is needed if payment is already scheduled.\n\nHappy to resend the invoice if that helps.\n\nThank you,\n${sig}`,
  };
}
function remindersFor(invoiceId) { return (state.reminders || []).filter((r) => r.invoiceId === invoiceId); }
function lastReminderFor(invoiceId) {
  const rows = remindersFor(invoiceId).slice().sort((a, b) => String(b.at).localeCompare(String(a.at)));
  return rows[0] || null;
}
function markReminderSent(inv, stage, channel = "email") {
  if (!inv) return null;
  const rec = { id: newId("rem"), invoiceId: inv.id, invoiceNumber: inv.number, stage, channel, at: new Date().toISOString(), amountPaise: openBalance(inv) };
  state.reminders = state.reminders || [];
  state.reminders.push(rec);
  logActivity("reminder.sent", `${inv.number} · ${stage}`);
  saveState();
  return rec;
}
function openChase(id) {
  const inv = invoiceById(id); if (!inv) return;
  const startStage = reminderStage(inv);
  let chosenStage = startStage;
  const d = reminderDraft(inv, startStage);
  const last = lastReminderFor(id);
  const hasEmail = !!(client(inv.clientId) && client(inv.clientId).email);
  const stages = [["friendly", "Friendly"], ["firm", "Firm"], ["final", "Final notice"]];
  const close = openDrawer(`Chase ${inv.number}`, `
    <div class="subtle" style="margin-bottom:10px">${p(openBalance(inv))} outstanding · due ${esc(inv.dueDate)}${daysOverdue(inv) > 0 ? ` · ${daysOverdue(inv)} day${daysOverdue(inv) === 1 ? "" : "s"} overdue` : ""}</div>
    <div class="pill-row" style="gap:8px;margin-bottom:10px">${stages.map(([k, l]) => `<button class="btn sm ${k === startStage ? "primary" : ""}" data-stage="${k}">${l}</button>`).join("")}</div>
    <div class="field"><label class="f">Subject</label><input id="ch_subject" value="${esc(d.subject)}"></div>
    <div class="field"><label class="f">Message</label><textarea id="ch_body" rows="10" style="width:100%">${esc(d.body)}</textarea></div>
    ${hasEmail ? "" : `<div class="subtle" style="color:var(--warn)">No email on file for this customer - copy the message and send it however you prefer.</div>`}
    ${last ? `<div class="subtle" style="margin-top:8px">Last reminder: ${esc(last.stage)} on ${esc(String(last.at).slice(0, 10))}.</div>` : ""}
    <div class="subtle" style="margin-top:8px">This tool never sends email itself. It drafts the message and opens it in your own mail app so you stay in control.</div>`,
    `<button class="btn" id="ch_close">Close</button>
     <button class="btn" id="ch_copy">Copy message</button>
     <button class="btn" id="ch_mail">Open in email</button>
     <button class="btn primary" id="ch_sent">Mark reminder sent</button>`);
  const setStage = (k) => {
    chosenStage = k;
    const nd = reminderDraft(inv, k);
    el("ch_subject").value = nd.subject; el("ch_body").value = nd.body;
    document.querySelectorAll("[data-stage]").forEach((b) => b.classList.toggle("primary", b.dataset.stage === k));
  };
  document.querySelectorAll("[data-stage]").forEach((b) => { b.onclick = () => setStage(b.dataset.stage); });
  el("ch_close").onclick = close;
  el("ch_copy").onclick = async () => {
    const text = `${el("ch_subject").value}\n\n${el("ch_body").value}`;
    try {
      if (typeof navigator !== "undefined" && navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text); toast("Message copied", "ok");
      } else { downloadText(`reminder-${inv.number}.txt`, text, "text/plain"); toast("Message downloaded", "ok"); }
    } catch (e) { downloadText(`reminder-${inv.number}.txt`, text, "text/plain"); toast("Message downloaded", "ok"); }
  };
  el("ch_mail").onclick = () => {
    const url = `mailto:${encodeURIComponent((client(inv.clientId) && client(inv.clientId).email) || "")}?subject=${encodeURIComponent(el("ch_subject").value)}&body=${encodeURIComponent(el("ch_body").value)}`;
    try { if (typeof location !== "undefined" && location.href) location.href = url; } catch (e) { /* sandboxed: no mail client */ }
  };
  el("ch_sent").onclick = () => {
    markReminderSent(inv, chosenStage);
    close(); render(); toast(`Reminder logged for ${inv.number}`, "ok");
  };
}

// ---- Document lifecycle actions ------------------------------------------

function applyVoid(id) {
  const inv = invoiceById(id); if (!inv || isVoid(inv)) return null;
  if (!guardPeriod(inv.date, "Invoice")) return null;
  const prev = { void: !!inv.void, status: inv.status };
  const before = auditSnapshot(inv);
  inv.void = true; inv.status = "void";
  recordChange("invoice.void", inv.number, before, inv, { reason: "Voided by user" });
  saveState();
  return { id, prev };
}
function applyUnvoid(id, prev) {
  const inv = invoiceById(id); if (!inv) return;
  const before = auditSnapshot(inv);
  inv.void = !!(prev && prev.void); inv.status = (prev && prev.status) || "issued";
  recordChange("invoice.unvoid", inv.number, before, inv, { reason: "Void undone" }); saveState();
}
function voidInvoice(id) {
  const inv = invoiceById(id); if (!inv || isVoid(inv)) return;
  confirmAction({
    title: `Void ${inv.number}?`,
    body: `Voiding keeps <b>${esc(inv.number)}</b> in the ledger as a reversal rather than deleting it. You can undo this from the message that appears.`,
    confirmLabel: "Void invoice",
    onConfirm: () => {
      const undo = applyVoid(id);
      render();
      toast(`${inv.number} voided`, "ok", { label: "Undo", onAction: () => { if (undo) { applyUnvoid(undo.id, undo.prev); render(); toast(`${inv.number} restored`, "ok"); } } });
    },
  });
}
const clientTaxProfile = () => taxProfileReady({ country: state.settings.country, regimeId: state.settings.regimeId, currency: state.settings.currency, taxId: state.company.gstin });
function blockIssueIfNotReady() {
  const t = clientTaxProfile();
  if (!t.ready) { toast(`Confirm your tax profile first (${t.missing.join(", ")}). Open Tax settings.`, "err"); return true; }
  return false;
}

function markInvoice(id, status) {
  const inv = invoiceById(id); if (!inv) return;
  if (status === "sent" && inv.status !== "sent" && blockIssueIfNotReady()) return;
  inv.status = status;
  if (status === "sent" && !inv.sentAt) inv.sentAt = new Date().toISOString().slice(0, 10);
  logActivity("invoice." + status, inv.number); saveState(); render(); toast(`${inv.number} marked ${status}`, "ok");
}

// ---- Invoice lifecycle, communication history and payment link ------------

function invoiceLifecycle(inv) {
  const pays = paymentsFor(inv.id);
  const paidPaise = pays.reduce((a, x) => a + x.amountPaise + (x.tdsDeductedPaise || 0), 0);
  const steps = [
    { label: "Drafted", at: inv.date, done: true },
    { label: "Sent to customer", at: inv.sentAt || (inv.status === "sent" ? inv.date : ""), done: !!(inv.sentAt || ["sent", "paid", "part-paid", "overdue"].includes(inv.status)) || pays.length > 0 },
    { label: "Part payment", at: pays.length && openBalance(inv) > 0 ? pays[0].date : "", done: pays.length > 0 && openBalance(inv) > 0 },
    { label: "Settled", at: openBalance(inv) === 0 && paidPaise > 0 ? pays.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)))[0].date : "", done: openBalance(inv) === 0 && paidPaise > 0 },
  ];
  if (isVoid(inv)) steps.push({ label: "Voided", at: "", done: true });
  return steps;
}

function invoiceComms(inv) {
  const rems = remindersFor(inv.id).map((r) => ({ at: String(r.at).slice(0, 10), kind: `Reminder (${r.stage})`, channel: r.channel || "email" }));
  const acts = (state.activity || []).filter((a) => a.detail === inv.number && /invoice\./.test(a.action)).map((a) => ({ at: String(a.at).slice(0, 10), kind: a.action.replace("invoice.", "Marked "), channel: "app" }));
  return rems.concat(acts).sort((a, b) => String(b.at).localeCompare(String(a.at)));
}

function paymentLinkFor(inv) {
  const open = openBalance(inv);
  if (!open || isVoid(inv) || state.settings.currency !== "INR" || !state.company.upiId) return null;
  const amt = (open / 100).toFixed(2);
  const params = new URLSearchParams({ pa: state.company.upiId, pn: state.company.name, am: amt, cu: "INR", tn: inv.number });
  return `upi://pay?${params.toString()}`;
}

async function copyText(text, okMsg = "Copied") {
  try {
    if (typeof navigator !== "undefined" && navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      toast(okMsg, "ok");
      return true;
    }
  } catch (e) { /* fall through to download */ }
  downloadText(`copy.txt`, text, "text/plain");
  toast("Downloaded instead of copied", "ok");
  return false;
}

function openCreditNote(id) {
  if (!can("write")) return toast("Read-only role: you cannot change ledger data", "err");
  const inv = invoiceById(id); if (!inv) return;
  const close = openDrawer(`Credit note against ${inv.number}`, `
    <div class="field"><label class="f">Amount (${esc(state.settings.currency)})</label><input id="cn_amt" value="${(inv.totals.totalPaise / 100).toString()}"></div>
    <div class="field"><label class="f">Reason</label><input id="cn_reason" placeholder="e.g. Service not delivered as scoped"></div>
    <div class="subtle">A credit note reduces revenue, tax and receivable and keeps the ledger balanced.</div>`,
    `<button class="btn" id="cn_cancel">Cancel</button><button class="btn primary" id="cn_save">Issue credit note</button>`);
  el("cn_cancel").onclick = close;
  el("cn_save").onclick = () => {
    const gross = toPaise(el("cn_amt").value || 0);
    if (gross <= 0) return toast("Credit note must be greater than zero", "err");
    const share = inv.totals.totalPaise ? gross / inv.totals.totalPaise : 0;
    const taxable = Math.round(inv.totals.taxablePaise * share);
    const gst = gross - taxable;
    state.creditNotes = state.creditNotes || [];
    state.creditNotes.push({
      id: newId("cn"), number: `CN-${inv.number}`, date: todayISO, clientId: inv.clientId,
      clientName: inv.clientName, invoiceNumber: inv.number, reason: el("cn_reason").value.trim(),
      taxablePaise: taxable, gstPaise: gst, totalPaise: gross,
    });
    logActivity("creditnote.create", `${inv.number} ${p(gross)}`);
    saveState(); close(); render(); toast("Credit note issued", "ok");
  };
}

// ---- Reports --------------------------------------------------------------

function viewReports() {
  const invs = invoicesInPeriod().filter((i) => !isVoid(i));
  const pays = state.payments.filter((x) => x.date.slice(0, 7) === state.period);
  const collected = pays.reduce((a, r) => a + r.amountPaise, 0);
  const taxed = invs.reduce((a, i) => a + (i.totals.totalTaxPaise ?? i.totals.gstPaise), 0);
  const taxable = invs.reduce((a, i) => a + i.totals.taxablePaise, 0);
  const buckets = { "0-30": 0, "31-60": 0, "61-90": 0, "90+": 0 };
  for (const inv of state.invoices) {
    if (isVoid(inv)) continue;
    const open = openBalance(inv); if (!open) continue;
    const days = Math.max(0, Math.round((new Date(todayISO) - new Date(inv.dueDate)) / 86400000));
    if (days <= 30) buckets["0-30"] += open; else if (days <= 60) buckets["31-60"] += open; else if (days <= 90) buckets["61-90"] += open; else buckets["90+"] += open;
  }
  const byClient = state.clients.map((c) => {
    const ci = invoicesInPeriod().filter((i) => i.clientId === c.id && !isVoid(i));
    return { name: c.name, billed: ci.reduce((a, i) => a + i.totals.totalPaise, 0), open: invoicesForClient(c.id).filter((i) => !isVoid(i)).reduce((a, i) => a + openBalance(i), 0) };
  }).filter((r) => r.billed || r.open);
  return `
  <div class="grid kpi">
    ${kpi("Taxable this period", p(taxable), `${invs.length} invoices`)}
    ${kpi(`${esc(taxNoun())} this period`, p(taxed), "Ready to reconcile")}
    ${kpi("Collected", p(collected), `${pays.length} receipts`)}
    ${kpi("Outstanding", p(Object.values(buckets).reduce((a, b) => a + b, 0)), "Across all clients")}
  </div>
  <div class="grid two">
    <div class="card"><div class="card-h"><h2>Revenue by client · ${esc(state.period)}</h2></div>
      <div class="card-b" style="padding:0"><table><thead><tr><th>Client</th><th class="num">Billed</th><th class="num">Open</th></tr></thead>
      <tbody>${byClient.map((r) => `<tr><td>${esc(r.name)}</td><td class="num">${p(r.billed)}</td><td class="num">${p(r.open)}</td></tr>`).join("") || `<tr><td colspan="3" class="muted" style="padding:16px">Nothing billed this period.</td></tr>`}</tbody></table></div></div>
    <div class="card"><div class="card-h"><h2>Receivables aging</h2></div>
      <div class="card-b">${Object.entries(buckets).map(([k, v]) => `<div style="margin-bottom:10px"><div class="pill-row" style="justify-content:space-between"><span class="subtle">${k} days</span><b class="num">${p(v)}</b></div><div class="meter"><i style="width:${(() => { const max = Math.max(1, ...Object.values(buckets)); return Math.round((v / max) * 100); })()}%"></i></div></div>`).join("")}</div></div>
  </div>`;
}

  return `<div class="card">
    <div class="card-h"><h2>Tax this period</h2><span class="hint">${esc(taxNoun())} · computed from your data</span></div>
    <div class="card-b">
      <div class="grid kpi">
        ${kpi("Taxable sales", p(t.taxablePaise), `${t.invoiceCount} invoices`)}
        ${kpi(taxNoun() + " on sales", p(t.totalTaxPaise), "Output tax")}

      </div>
      ${t.cgstPaise || t.sgstPaise || t.igstPaise ? `<table style="margin-top:12px"><tbody>
        <tr><td>CGST</td><td class="num">${p(t.cgstPaise)}</td></tr>
        <tr><td>SGST</td><td class="num">${p(t.sgstPaise)}</td></tr>

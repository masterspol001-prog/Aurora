// ---- Invoices -------------------------------------------------------------

function filteredInvoices() {
  const q = (state.invQuery || "").toLowerCase();
  const status = state.invStatus || "all";
  return state.invoices.filter((i) => {
    const hay = `${i.number} ${i.clientName} ${i.description || ""}`.toLowerCase();
    if (q && !hay.includes(q)) return false;
    if (status !== "all" && invStatus(i) !== status) return false;
    return true;
  });
}

function invoiceRowsHtml(rows, sel = invSelectionSet()) {
  return rows.map((i) => {
    const t = i.totals;
    const pay = paymentsFor(i.id);
    const asym = pay.length ? detectPaymentAsymmetry({ invoice: { totalPaise: t.totalPaise, tdsPaise: t.tdsPaise }, payment: pay[pay.length - 1] }) : null;
    return `<tr class="clickable" data-inv="${i.id}">
      <td><input type="checkbox" data-checkinv="${i.id}" ${sel.has(i.id) ? "checked" : ""} aria-label="Select ${esc(i.number)}"></td>
      <td class="mono">${esc(i.number)}</td><td>${esc(i.clientName)}</td>
      <td>${statusBadge(i)}</td>
      <td class="num">${p(t.taxablePaise)}</td>
      ${taxBodyCells(t)}
      <td class="num"><b>${p(t.totalPaise)}</b></td>
      <td class="num">${p(openBalance(i))}</td>
      <td>${pay.length ? (asym.clean ? `<span class="badge b-good">reconciled</span>` : `<span class="badge b-urgent">${asym.flags.length} flag${asym.flags.length === 1 ? "" : "s"}</span>`) : (openBalance(i) === 0 ? `<span class="badge b-good">paid</span>` : `<span class="badge b-muted">unpaid</span>`)}</td>
    </tr>`;
  }).join("") || `<tr><td colspan="10" style="padding:0">${emptyState({ title: rows.length ? "No invoices match" : "No invoices yet", body: rows.length ? "Try a different search or status filter." : "Create your first invoice to start the ledger.", cta: `<button class="btn sm primary" id="emptyNewInv">New invoice</button>` })}</td></tr>`;
}

function wireInvoiceListRows() {
  document.querySelectorAll("#invRows [data-inv]").forEach((row) => { row.onclick = () => openInvoiceDetail(row.dataset.inv); });
  document.querySelectorAll("#invRows [data-checkinv]").forEach((cb) => { cb.onclick = (e) => e.stopPropagation(); cb.onchange = () => toggleInvSelect(cb.dataset.checkinv); });
}

function paintInvoiceRows() {
  const host = el("invRows");
  if (!host) { render(); return; }
  const rows = filteredInvoices();
  host.innerHTML = invoiceRowsHtml(rows);
  const count = el("invCount"); if (count) count.textContent = `${rows.length} of ${state.invoices.length}`;
  wireInvoiceListRows();
}

function viewInvoices() {
  const status = state.invStatus || "all";
  const rows = filteredInvoices();
  const sel = invSelectionSet();
  const selCount = rows.filter((i) => sel.has(i.id)).length;
  const allSelected = rows.length > 0 && selCount === rows.length;
  return `
  <div class="card">
    <div class="card-h"><h2>Invoices</h2><div class="toolbar">
      <input id="invSearch" placeholder="Search number, client, description..." style="width:260px" value="${esc(state.invQuery || "")}">
      <select id="invStatus" style="width:auto">
        ${["all", "draft", "issued", "sent", "part-paid", "paid", "overdue", "void"].map((s) => `<option value="${s}" ${s === status ? "selected" : ""}>${s === "all" ? "All statuses" : s}</option>`).join("")}
      </select>
      <span class="hint" id="invCount">${rows.length} of ${state.invoices.length}</span>
    </div></div>
    ${selCount ? `<div class="card-b" style="padding:10px 14px;border-bottom:1px solid var(--line)">
      <div class="pill-row" style="gap:8px;align-items:center;flex-wrap:wrap">
        <b>${selCount} selected</b>
        <button class="btn sm" id="bulk_sent">Mark sent</button>
        <button class="btn sm" id="bulk_paid">Mark paid</button>
        <button class="btn sm" id="bulk_export">Export CSV</button>
        <button class="btn sm danger" id="bulk_void">Void</button>
        <button class="btn sm" id="bulk_clear">Clear</button>
        <span class="subtle">Keyboard: j / k move, x select, Esc clear</span>
      </div>
    </div>` : ""}
    <div class="card-b" style="padding:0">
      <table>
        <thead><tr>
          <th style="width:34px"><input type="checkbox" id="invSelectAll" ${allSelected ? "checked" : ""} aria-label="Select all invoices"></th>
          <th>Invoice</th><th>Client</th><th>Status</th><th class="num">Taxable</th>${taxHeadCells()}<th class="num">Total</th><th class="num">Open</th><th>Recon</th></tr></thead>
        <tbody id="invRows">${invoiceRowsHtml(rows, sel)}</tbody>
      </table>
    </div>
  </div>
  <div class="card"><div class="card-b">${caveatCollapsed()}</div></div>`;
}

// ---- Preview queue --------------------------------------------------------

function viewQueue() {
  const items = state.invoices.filter((i) => i.preview).map((i) => {
    const q = queueItemStatus({ dueDate: i.dueDate, today: todayISO, totalPaise: i.totals.totalPaise, openFlags: 0 });
    return { i, q };
  }).sort((a, b) => b.q.agingDays - a.q.agingDays);
  const order = { critical: 0, high: 1, medium: 2, low: 3 };
  items.sort((a, b) => order[a.q.priority] - order[b.q.priority]);
  return `
  <div class="card">
    <div class="card-h"><h2>Preview queue</h2><span class="hint">Priority, aging and the next action for each item</span></div>
    <div class="card-b" style="padding:0">
      <table>
        <thead><tr><th>Priority</th><th>Invoice</th><th>Client</th><th class="num">Aging</th><th class="num">Amount</th><th>Next action</th></tr></thead>
        <tbody>${items.map(({ i, q }) => `<tr class="clickable" data-inv="${i.id}">
          <td><span class="badge ${q.priority === "critical" ? "b-urgent" : q.priority === "high" ? "b-warn" : q.priority === "medium" ? "b-info" : "b-muted"}">${q.priority}</span></td>
          <td class="mono">${esc(i.number)}</td><td>${esc(i.clientName)}</td>
          <td class="num">${q.agingDays > 0 ? "+" : ""}${q.agingDays}d</td>
          <td class="num">${p(i.totals.totalPaise)}</td>
          <td>${esc(q.nextAction)}</td>
        </tr>`).join("") || `<tr><td colspan="6" class="empty">Queue is empty.</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`;
}

// ---- Balance history ------------------------------------------------------

function viewBalance() {
  const filter = state.balanceClient || "all";
  const invs = state.invoices.filter((i) => filter === "all" || i.clientId === filter);
  const ledgers = invs.map((inv) => {
    const entries = [{ type: "invoice", date: inv.date, amountPaise: inv.totals.totalPaise, label: "Invoice " + inv.number }];
    for (const pay of paymentsFor(inv.id)) {
      entries.push({ type: "payment", date: pay.date, amountPaise: pay.amountPaise, label: "Payment " + (pay.method || "") + " " + (pay.reference || "") });
      if (pay.tdsDeductedPaise) entries.push({ type: "tds_credit", date: pay.date, amountPaise: pay.tdsDeductedPaise, label: "TDS credit" });
    }
    const hasPayment = paymentsFor(inv.id).length > 0;
    return { inv, ...runningBalance(entries), hasPayment };
  });
  return `
  <div class="card">
    <div class="card-h">
      <h2>Balance history</h2>
      <select id="balFilter" style="width:auto">
        <option value="all" ${filter === "all" ? "selected" : ""}>All clients</option>
        ${state.clients.map((c) => `<option value="${c.id}" ${filter === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}
      </select>
    </div>
    <div class="card-b grid">
      ${ledgers.map(({ inv, rows, closingPaise, hasPayment }) => `
        <div>
          <div class="pill-row" style="justify-content:space-between">
            <b>${esc(inv.number)} · ${esc(inv.clientName)}</b>
            <span>
              ${closingPaise <= 0 ? `<span class="badge b-good">settled</span>` : `<span class="badge b-warn">open ${p(closingPaise)}</span>`}
            </span>
          </div>
          <table style="margin-top:8px">
            <thead><tr><th>Date</th><th>Entry</th><th class="num">Amount</th><th class="num">Signed</th><th class="num">Balance</th></tr></thead>
            <tbody>${rows.map((r) => `<tr>
              <td class="mono">${r.date}</td><td>${esc(r.label)} <span class="tag">${r.type}</span></td>
              <td class="num">${p(r.amountPaise)}</td>
              <td class="num" style="color:${r.signedPaise >= 0 ? "var(--ink)" : "var(--good)"}">${r.signedPaise >= 0 ? "+" : "-"}${p(Math.abs(r.signedPaise))}</td>
              <td class="num"><b>${p(r.balancePaise)}</b></td>
            </tr>`).join("")}</tbody>
          </table>
          ${!hasPayment ? `<div class="flag" style="border-color:#f3e0c7;background:#fff8f0;color:#7a4e12">No payment recorded yet - the full outstanding stays on the receivable.</div>` : ""}
        </div>`).join("") || `<div class="empty">No invoices for this filter.</div>`}
    </div>
  </div>`;
}

// ---- Audit trail ----------------------------------------------------------

function auditRows() {
  return (state.activity || []).map((a) => ({
    at: a.at, actor: a.actor || "owner", action: a.action, detail: a.detail,
    changes: a.changes || [], reason: a.reason || "",
  }));
}

function viewAudit() {
  const rows = auditRows();
  const byActor = rows.reduce((m, r) => ((m[r.actor] = (m[r.actor] || 0) + 1), m), {});
  const q = (state.auditQuery || "").toLowerCase();
  const filtered = rows.filter((r) => !q || `${r.action} ${r.detail}`.toLowerCase().includes(q));
  const ps = pageSlice(filtered, "auditPage", 100);
  return `
  <div class="card">
    <div class="card-h"><h2>Audit trail</h2><div class="toolbar">
      <input id="auditSearch" placeholder="Search actions..." style="width:210px" value="${esc(state.auditQuery || "")}">
      <button class="btn" id="auditExport">Export CSV</button></div></div>
    <div class="card-b">
      <div class="subtle">Every action recorded in this workspace, with the acting role and time. This is a working log, not a tamper-proof audit system - it is stored with the workspace and included in backups.</div>
      <div class="row c3" style="margin-top:10px">${mini("Entries", String(rows.length))}${mini("Owner", String(byActor.owner || 0))}${mini("Bookkeeper / accountant", String((byActor.bookkeeper || 0) + (byActor.accountant || 0)))}</div>
    </div>

function snapshot() {
  const invs = invoicesInPeriod().filter((i) => !isVoid(i));
  const billed = invs.reduce((a, i) => a + i.totals.totalPaise, 0);
  const pays = state.payments.filter((x) => x.date.slice(0, 7) === state.period);
  const collected = pays.reduce((a, r) => a + r.amountPaise, 0);
  const outstanding = state.invoices.filter((i) => !isVoid(i)).reduce((a, i) => a + openBalance(i), 0);
  const gstCollected = invs.reduce((a, i) => a + (i.totals.totalTaxPaise ?? i.totals.gstPaise ?? 0), 0);
  const tdsCredits = invs.reduce((a, i) => a + (i.totals.tdsPaise || 0), 0);
  const upcoming = state.invoices
    .filter((i) => !isVoid(i) && openBalance(i) > 0 && i.dueDate >= todayISO)
    .reduce((a, i) => a + openBalance(i), 0);
  return { billed, collected, outstanding, gstCollected, tdsCredits, upcoming };
}

function businessActivityRows() {
  const rows = [];
  for (const i of state.invoices) {
    if (isVoid(i)) continue;
    rows.push({ date: i.date, clientName: i.clientName, activity: "Invoice", ref: i.number, amountPaise: i.totals.totalPaise, status: invStatus(i), inv: i });
  }
  for (const y of state.payments) {
    const inv = invoiceById(y.invoiceId);
    rows.push({ date: y.date, clientName: inv?.clientName || client(y.clientId)?.name || "-", activity: "Payment", ref: y.invoiceNumber || y.reference || "-", amountPaise: y.amountPaise, status: "received", inv });
  }
  return rows.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
}

// ---- Operational intelligence (all derived, exact minor units) ------------

function ageDays(dateISO) {
  if (!dateISO) return null;
  return Math.floor((new Date(todayISO + "T00:00:00Z") - new Date(dateISO + "T00:00:00Z")) / 86400000);
}
function greeting() {
  const h = new Date().getHours();
  return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
}
function clientOpenInvoices(clientId) { return invoicesForClient(clientId).filter((i) => !isVoid(i) && openBalance(i) > 0); }
function avgPaymentDaysFor(clientId) {
  const gaps = [];
  for (const inv of invoicesForClient(clientId).filter((i) => !isVoid(i))) {
    const pays = paymentsFor(inv.id);
    if (!pays.length) continue;
    const firstPay = pays.slice().sort((a, b) => String(a.date).localeCompare(String(b.date)))[0];
    const g = (new Date(firstPay.date + "T00:00:00Z") - new Date(inv.date + "T00:00:00Z")) / 86400000;
    if (isFinite(g) && g >= 0) gaps.push(g);
  }
  return gaps.length ? Math.round(gaps.reduce((a, b) => a + b, 0) / gaps.length) : null;
}
function customerStats(clientId) {
  const c = client(clientId) || {};
  const invs = invoicesForClient(clientId).filter((i) => !isVoid(i));
  const billed = invs.reduce((a, i) => a + i.totals.totalPaise, 0);
  const openInvs = clientOpenInvoices(clientId);
  const outstanding = openInvs.reduce((a, i) => a + openBalance(i), 0);
  const overdueInvs = openInvs.filter((i) => i.dueDate < todayISO);
  const overdue = overdueInvs.reduce((a, i) => a + openBalance(i), 0);
  const oldestOverdueDays = overdueInvs.length ? Math.max(...overdueInvs.map((i) => ageDays(i.dueDate))) : 0;
  const pays = state.payments.filter((x) => x.clientId === clientId || (invoiceById(x.invoiceId) && invoiceById(x.invoiceId).clientId === clientId));
  const collected = pays.reduce((a, x) => a + x.amountPaise + x.tdsDeductedPaise, 0);
  const lastInvoice = invs.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)))[0] || null;
  const lastPayment = pays.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)))[0] || null;
  const avgPaymentDays = avgPaymentDaysFor(clientId);
  let health = "never-invoiced";
  if (invs.length) health = overdue > 0 ? (oldestOverdueDays > 14 ? "at-risk" : "watch") : (outstanding === 0 ? "healthy" : "watch");
  return { c, invoiceCount: invs.length, billedPaise: billed, outstandingPaise: outstanding, overduePaise: overdue, oldestOverdueDays, lastInvoiceDate: lastInvoice ? lastInvoice.date : "", lastPaymentDate: lastPayment ? lastPayment.date : "", collectedPaise: collected, avgPaymentDays, terms: (c.terms || 15), health };
}
function overdueSummary() {
  const rows = state.invoices.filter((i) => !isVoid(i) && openBalance(i) > 0 && i.dueDate < todayISO);
  return { count: rows.length, totalPaise: rows.reduce((a, i) => a + openBalance(i), 0), oldestDays: rows.length ? Math.max(...rows.map((i) => ageDays(i.dueDate))) : 0, invoices: rows };
}
function unmatchedPayments() { return state.payments.filter((x) => !x.invoiceId); }
function cashComingIn(days = 7) {
  const until = addDays(todayISO, days);
  return state.invoices
    .filter((i) => !isVoid(i) && openBalance(i) > 0 && i.dueDate >= todayISO && i.dueDate <= until)
    .map((i) => ({ date: i.dueDate, clientName: i.clientName, amountPaise: openBalance(i), inv: i }))
    .sort((a, b) => String(a.date).localeCompare(String(b.date)));
}
function recurringSummary() {
  const active = (state.recurring || []).filter((r) => r.active !== false);
  const until = addDays(todayISO, 30);
  const scheduled = active.filter((r) => r.nextDate && r.nextDate <= until);
  return { activeCount: active.length, next30Paise: scheduled.reduce((a, r) => a + (r.ratePaise || 0), 0), due: dueRecurringCount(), rows: active };
}
function taxSnapshot() {
  const invs = invoicesInPeriod().filter((i) => !isVoid(i));
  const sum = (f) => invs.reduce((a, i) => a + (i.totals[f] || 0), 0);
  return {
    taxablePaise: invs.reduce((a, i) => a + (i.totals.taxablePaise || 0), 0),
    cgstPaise: sum("cgstPaise"), sgstPaise: sum("sgstPaise"), igstPaise: sum("igstPaise"),
    totalTaxPaise: invs.reduce((a, i) => a + (i.totals.totalTaxPaise ?? i.totals.gstPaise ?? 0), 0),
    tdsPaise: sum("tdsPaise"), invoiceCount: invs.length,
  };
}
function moneyMap() {
  const invs = state.invoices.filter((i) => !isVoid(i));
  return {
    invoicedPaise: invs.reduce((a, i) => a + i.totals.totalPaise, 0),
    receivedPaise: state.payments.reduce((a, x) => a + x.amountPaise + x.tdsDeductedPaise, 0),
    unmatchedPaise: unmatchedPayments().reduce((a, x) => a + x.amountPaise, 0),
    overduePaise: overdueSummary().totalPaise,
    recurringPaise: recurringSummary().next30Paise,
    taxPaise: invs.reduce((a, i) => a + (i.totals.totalTaxPaise ?? i.totals.gstPaise ?? 0), 0),
  };
}
function explainRows(kind) {
  const rows = [];
  let title = "", note = "";
  if (kind === "outstanding") {
    title = "Outstanding - how this is calculated";
    note = "Open balance across all non-void invoices: invoice total minus payments and tax withheld. Credit notes reduce the receivable where recorded.";
    for (const i of state.invoices.filter((x) => !isVoid(x) && openBalance(x) > 0)) rows.push({ ref: i.number, label: i.clientName, detail: `Due ${i.dueDate}`, amountPaise: openBalance(i) });
  } else if (kind === "overdue") {
    title = "Overdue - how this is calculated";
    note = "Open balance on invoices whose due date has already passed.";
    for (const i of overdueSummary().invoices) rows.push({ ref: i.number, label: i.clientName, detail: `${ageDays(i.dueDate)} days overdue`, amountPaise: openBalance(i) });
  } else if (kind === "expected") {
    title = "Expected in the next 7 days";
    note = "Open balance on invoices due today or within the next 7 days.";
    for (const r of cashComingIn(7)) rows.push({ ref: r.inv.number, label: r.clientName, detail: `Due ${r.date}`, amountPaise: r.amountPaise });
  } else if (kind === "collected") {
    title = "Collected this period";
    note = "Payments recorded in the selected period, including tax withheld by customers.";
    for (const x of state.payments.filter((y) => y.date.slice(0, 7) === state.period)) rows.push({ ref: x.invoiceNumber || x.reference || "-", label: client(x.clientId)?.name || "-", detail: `${x.date} · ${x.method || ""}`, amountPaise: x.amountPaise + (x.tdsDeductedPaise || 0) });
  } else if (kind === "tax") {
    title = "Output tax this period";
    note = "Tax on recorded invoices in the period. This is a calculation from your data, not a filed return.";
    const t = taxSnapshot();
    rows.push({ ref: "Taxable sales", label: "", detail: "", amountPaise: t.taxablePaise });
    if (t.cgstPaise) rows.push({ ref: "CGST", label: "", detail: "", amountPaise: t.cgstPaise });
    if (t.sgstPaise) rows.push({ ref: "SGST", label: "", detail: "", amountPaise: t.sgstPaise });
    if (t.igstPaise) rows.push({ ref: "IGST", label: "", detail: "", amountPaise: t.igstPaise });
    rows.push({ ref: `Total ${taxNoun()}`, label: "", detail: "", amountPaise: t.totalTaxPaise });
  } else if (kind === "recurring") {
    title = "Recurring scheduled in the next 30 days";
    note = "Sum of active recurring templates whose next invoice date falls in the next 30 days. Generation stays manual.";
    for (const r of recurringSummary().rows.filter((x) => x.nextDate && x.nextDate <= addDays(todayISO, 30))) rows.push({ ref: cadenceLabel(r.cadence), label: client(r.clientId)?.name || "-", detail: `Next ${r.nextDate}`, amountPaise: r.ratePaise || 0 });
  }
  return { title, note, rows, totalPaise: rows.reduce((a, r) => a + r.amountPaise, 0) };
}
function openExplain(kind) {
  const e = explainRows(kind);
  const close = openDrawer(e.title, `
    <div class="subtle" style="margin-bottom:10px">${esc(e.note)}</div>
    <table><tbody>${e.rows.map((r) => `<tr><td>${r.ref ? `<span class="mono">${esc(r.ref)}</span> ` : ""}${esc(r.label)}</td><td class="subtle">${esc(r.detail)}</td><td class="num">${p(r.amountPaise)}</td></tr>`).join("") || `<tr><td colspan="3" class="empty">Nothing contributing.</td></tr>`}
      <tr><td colspan="2"><b>Total</b></td><td class="num"><b>${p(e.totalPaise)}</b></td></tr></tbody></table>
    <div class="subtle" style="margin-top:10px">Calculated ${esc(new Date().toLocaleTimeString())} from ${state.invoices.length} invoices and ${state.payments.length} payments in this workspace.</div>`,
    `<button class="btn" id="ex_close">Close</button>`);
  el("ex_close").onclick = close;
}

function ledgerSource(clientId) {

    .filter((i) => !clientId || i.clientId === clientId)
    .map((i) => ({
      date: i.date, number: i.number, clientId: i.clientId, clientName: i.clientName,
      description: i.description, totalPaise: i.totals.totalPaise,

  const payments = state.payments.filter((x) => !clientId || x.clientId === clientId);

}

const periodLock = (period) => (state.periods || []).find((x) => x.period === period) || null;
const isPeriodLocked = (period) => { const l = periodLock(period); return !!(l && l.hard); };
const periodOf = (date) => String(date || "").slice(0, 7);
function guardPeriod(date, what) {
  const per = periodOf(date);
  if (per && isPeriodLocked(per)) { toast(`${what || "This record"} (${per}) is in a closed, locked period. Reopen ${per} first.`, "err"); return false; }
  return true;
}
function closePeriod(period, opts = {}) {
  const blockers = closeBlockers({ invoices: state.invoices, payments: state.payments, journals: allJournals(), quarantine: state.quarantine || [] });
  if (blockers.length && !opts.override) { toast(`Cannot sign off: ${blockers.map((b) => b.label).join(", ")}`, "err"); return; }
  const hard = opts.hard !== undefined ? !!opts.hard : state.settings.hardLock === true;
  if (opts.override) {
    (state.closeOverrides = state.closeOverrides || {})[period] = { reason: opts.override, at: todayISO, by: state.role };
    logActivity("period.close.override", `${period}: ${opts.override}`);
  }
  (state.periods = state.periods || []).push({ period, at: todayISO, by: state.role || "owner", hard });
  logActivity("period.close", `${period}${hard ? " (locked)" : " (soft)"}`);
  saveState(); render(); toast(`Signed off ${period}${hard ? " and locked" : ""}`, "ok");
}
function overrideClose(period, reason) {
  if (!can("close")) { toast("Only an owner can sign off a period.", "err"); return; }
  if (!reason || !String(reason).trim()) { toast("A reason is required to override a blocker.", "err"); return; }
  closePeriod(period, { override: String(reason).trim() });
}
function openOverrideClose(period) {
  if (!can("close")) { toast("Only an owner can sign off a period.", "err"); return; }
  beginModal();
  el("modalRoot").innerHTML = `
    <div class="modal-wrap" id="ovw">
      <div class="modal" role="dialog" aria-modal="true" aria-label="Sign off with a reason" tabindex="-1" style="max-width:480px">
        <div class="modal-h"><h2 style="margin:0;font-size:16px">Sign off ${esc(period)} with a reason</h2><button class="icon-btn" id="ov_x" aria-label="Close">x</button></div>
        <div class="modal-b">
          <div class="flag" style="font-size:13px;line-height:1.55">This records a deliberate override of the blockers above. Your reason is written to the audit trail next to the sign-off.</div>
          <div class="field" style="margin-top:12px"><label class="f">Reason</label><textarea id="ov_reason" rows="3" placeholder="e.g. known timing difference on INV-1042"></textarea></div>
        </div>
        <div class="modal-f">
          <button class="btn" id="ov_cancel">Cancel</button>
          <button class="btn danger" id="ov_ok">Sign off with reason</button>
        </div>
      </div>
    </div>`;
  const close = () => endModal();
  __modalClose = close;
  el("ov_x").onclick = close;
  el("ov_cancel").onclick = close;
  el("ovw").onclick = (e) => { if (e.target.id === "ovw") close(); };
  el("ov_ok").onclick = () => { const r = el("ov_reason").value; if (!r || !r.trim()) { toast("A reason is required.", "err"); return; } close(); overrideClose(period, r); };
  focusDialog();
}
function reopenPeriod(period) {
  confirmAction({ title: `Reopen ${period}?`, body: "This removes the sign-off so the period is open again. The audit trail keeps the record that it was once closed.", confirmLabel: "Reopen", onConfirm: () => {
    state.periods = (state.periods || []).filter((x) => x.period !== period);
    logActivity("period.reopen", period);
    saveState(); render(); toast(`Reopened ${period}`, "");

}

// ---- Year-end close -------------------------------------------------------

function financialYearRange(period) {
  const [y, m] = String(period).split("-").map(Number);
  const startMonth = state.settings.regimeId === "IN_GST" ? 4 : 1;
  const startYear = m >= startMonth ? y : y - 1;
  const start = `${startYear}-${String(startMonth).padStart(2, "0")}-01`;
  const endYear = startMonth === 1 ? startYear : startYear + 1;
  const endMonth = startMonth === 1 ? 12 : startMonth - 1;
  const end = `${endYear}-${String(endMonth).padStart(2, "0")}-31`;
  return { start, end, label: `FY ${startYear}-${String(endYear).slice(2)}` };
}

function yearEndClosed(period) {
  const { label } = financialYearRange(period);
  return (state.journals || []).some((j) => j.source === "year_end" && String(j.ref || "").includes(label.replace(/\s+/g, "-")));
}

function yearEndClose(period) {
  const { start, end, label } = financialYearRange(period);
  if (yearEndClosed(period)) return toast(`${label} is already closed`, "");
  const pl = profitAndLoss(allJournals(), state.coa, { from: start, to: end });
  if (!pl.revenuePaise && !pl.cogsPaise && !pl.expensePaise) return toast("Nothing to close in this financial year yet", "");
  const lines = [];
  for (const l of pl.revenueLines) if (l.amountPaise) lines.push({ account: l.code, debitPaise: l.amountPaise, creditPaise: 0 });
  for (const l of [...pl.cogsLines, ...pl.expenseLines]) if (l.amountPaise) lines.push({ account: l.code, debitPaise: 0, creditPaise: l.amountPaise });
  const debits = lines.reduce((a, l) => a + l.debitPaise, 0);
  const credits = lines.reduce((a, l) => a + l.creditPaise, 0);
  if (debits > credits) lines.push({ account: "3100", debitPaise: 0, creditPaise: debits - credits });
  else if (credits > debits) lines.push({ account: "3100", debitPaise: credits - debits, creditPaise: 0 });
  const entry = { id: newId("jrnl"), date: end, ref: `YEAR-END-${label.replace(/\s+/g, "-")}`, memo: `${label} close - profit to retained earnings`, source: "year_end", createdBy: state.role || "owner", lines };
  const check = validateJournal(entry);
  if (!check.balanced) return toast(check.errors[0] || "Year-end entry did not balance", "err");
  state.journals.push(entry);
  recordChange("year.end.close", label, null, entry, { reason: `${label} closed; net ${p(pl.netProfitPaise)} to retained earnings` });
  saveState(); render(); toast(`${label} closed: ${p(pl.netProfitPaise)} to retained earnings`, "ok");
}

function bankSuggestions(txn) {
  if (txn.amountPaise <= 0) return [];
  const out = [];
  const desc = (txn.description || "").toUpperCase();
  for (const inv of state.invoices) {
    if (isVoid(inv)) continue;
    const bal = openBalance(inv);
    if (bal <= 0) continue;
    const exact = bal === txn.amountPaise;
    const near = Math.abs(bal - txn.amountPaise) <= Math.max(100, Math.round(bal * 0.01));
    const firstWord = (inv.clientName || "").split(" ")[0].toUpperCase();
    const nameHit = firstWord.length > 2 && desc.includes(firstWord);
    if (exact) out.push({ inv, score: 100, reason: `Exact match to the ${p(bal)} open on ${inv.number}.` });
    else if (nameHit) out.push({ inv, score: 75, reason: `${inv.clientName} appears in the bank description.` });
    else if (near) out.push({ inv, score: 60, reason: `Within 1% of the ${p(bal)} open on ${inv.number}.` });
  }
  return out.sort((a, b) => b.score - a.score).slice(0, 6);
}

    ${t.status !== "unmatched" ? `<div class="okline">This line is already ${esc(t.status)}${t.matchedId ? ` (${esc(t.matchedType)})` : ""}.</div>
      <div class="advice" style="margin-top:10px"><button class="btn sm" id="bm_unmatch">Unmatch</button></div>` : ""}
    ${isIn ? `<div class="sub" style="margin:6px 0"><b>Match to an open invoice</b></div>
      ${sugg.length ? sugg.map((s) => `<div class="card" style="box-shadow:none;margin-bottom:8px"><div class="card-b">
        <div class="pill-row" style="justify-content:space-between"><b>${esc(s.inv.number)}</b><span class="badge ${s.score >= 90 ? "b-good" : "b-warn"}">${s.score >= 90 ? "high confidence" : "possible"}</span></div>
        <div class="subtle">${esc(s.inv.clientName)} · open ${p(openBalance(s.inv))}</div>
        <div class="subtle" style="margin-top:4px">${esc(s.reason)}</div>
        <div class="advice" style="margin-top:8px"><button class="btn sm primary" data-matchinv="${esc(s.inv.id)}">Match &amp; record payment</button></div>
      </div></div>`).join("") : `<div class="empty">No open invoice looks like a match. File it as an expense or ignore it.</div>`}` : ""}
    <div class="sub" style="margin:12px 0 6px"><b>File as an expense</b></div>
    <div class="advice"><button class="btn sm" id="bm_expense">Create expense from this line</button></div>
    ${t.status === "unmatched" ? `<div class="advice" style="margin-top:12px"><button class="btn sm" id="bm_ignore">Ignore this line</button></div>` : ""}`,
    `<button class="btn" id="bm_close">Close</button>`);
  el("bm_close").onclick = close;
  document.querySelectorAll("#modalRoot [data-matchinv]").forEach((b) => { b.onclick = () => { close(); matchTxnToInvoice(t.id, b.dataset.matchinv); }; });
  const be = el("bm_expense"); if (be) be.onclick = () => { close(); openExpenseModal(null, { date: t.date, reference: t.reference || t.description, paidFrom: t.accountId, netRupees: (Math.abs(t.amountPaise) / 100).toString(), gstRate: 0, bankTxnId: t.id }); };
  const bi = el("bm_ignore"); if (bi) bi.onclick = () => { t.status = "ignored"; logActivity("bank.ignore", t.description); saveState(); close(); render(); toast("Line ignored", ""); };
  const bu = el("bm_unmatch"); if (bu) bu.onclick = () => {
    const payId = t.matchedType === "payment" ? t.matchedId : null;
    if (payId) state.payments = state.payments.filter((p) => p.id !== payId);
    const expId = t.matchedType === "expense" ? t.matchedId : null;
    if (expId) state.expenses = state.expenses.filter((e) => e.id !== expId);
    t.status = "unmatched"; t.matchedType = null; t.matchedId = null;
    logActivity("bank.unmatch", t.description); saveState(); close(); render(); toast("Line unmatched", "");
  };
}

function matchTxnToInvoice(txnId, invoiceId) {
  const t = state.bankTxns.find((x) => x.id === txnId); const inv = invoiceById(invoiceId);
  if (!t || !inv) return;
  const pay = { id: newId("pay"), clientId: inv.clientId, invoiceId: inv.id, invoiceNumber: inv.number, date: t.date, amountPaise: t.amountPaise, tdsDeductedPaise: 0, method: "Bank feed", reference: t.reference || t.description };
  state.payments.push(pay);
  t.status = "matched"; t.matchedType = "payment"; t.matchedId = pay.id;
  logActivity("bank.match", `${t.description} -> ${inv.number}`);
  saveState(); render(); toast(`Matched to ${inv.number}`, "ok");
}

function openBankImport() {
  if (!can("write")) return toast("Read-only role: you cannot change ledger data", "err");
  const close = openDrawer("Import bank statement (CSV)", `
    <div class="subtle" style="margin-bottom:8px">Paste or choose a CSV with columns: <span class="mono">date,description,amount[,reference]</span>. Amounts are signed: positive for money in, negative for money out. Dates use YYYY-MM-DD. Nothing leaves your device.</div>
    <div class="field"><label class="f">Account</label><select id="bi_acct">${accountOptions()}</select></div>
    <div class="field"><label class="f">CSV</label><textarea id="bi_csv" rows="7" placeholder="date,description,amount,reference"></textarea></div>
    <div class="field" style="margin:0"><label class="f">Or choose a file</label><input type="file" id="bi_file" accept=".csv,text/csv"></div>`,
    `<button class="btn" id="bi_cancel">Cancel</button><button class="btn primary" id="bi_save">Import lines</button>`);
  el("bi_cancel").onclick = close;
  const file = el("bi_file");
  file.onchange = () => { const f = file.files && file.files[0]; if (f) { const r = new FileReader(); r.onload = () => { el("bi_csv").value = String(r.result || ""); }; r.readAsText(f); } };
  el("bi_save").onclick = () => {
    const accountId = el("bi_acct").value;
    const rows = parseCsv(el("bi_csv").value || "").filter((r) => r.length && r[0] && !/^date$/i.test(r[0]));
    let n = 0;
    for (const r of rows) {
      const [date, description, amount, reference] = r;
      const value = Number(String(amount).replace(/[^0-9.\-]/g, ""));
      if (!date || !description || !isFinite(value) || value === 0) continue;
      state.bankTxns.push({ id: newId("txn"), accountId, date, description, amountPaise: toPaise(value), reference: reference || "", status: "unmatched" });
      n += 1;
    }
    logActivity("bank.import", `${n} line${n === 1 ? "" : "s"}`);
    saveState(); close(); render(); toast(n ? `Imported ${n} line${n === 1 ? "" : "s"}` : "No valid lines found", n ? "ok" : "err");
  };
}

// --- Expenses --------------------------------------------------------------

function viewExpenses() {
  const q = (state.expenseQuery || "").toLowerCase();
  const all = state.expenses || [];
  const rows = all.filter((e) => !q || `${e.vendorName} ${e.category} ${e.reference}`.toLowerCase().includes(q)).sort((a, b) => (a.date < b.date ? 1 : -1));
  const inPeriod = periodExpenses();
  const total = inPeriod.reduce((a, e) => a + e.netPaise, 0);
  const gst = inPeriod.reduce((a, e) => a + e.gstPaise, 0);
  const byCat = {};
  for (const e of inPeriod) byCat[e.category] = (byCat[e.category] || 0) + e.netPaise;
  const top = Object.entries(byCat).sort((a, b) => b[1] - a[1])[0];
  const maxCat = Math.max(1, ...Object.values(byCat));
  return `
  <div class="grid kpi">
    ${kpi("Expenses this month", p(total), `${inPeriod.length} entr${inPeriod.length === 1 ? "y" : "ies"}`)}
    ${kpi("Input " + esc(taxNoun()), p(gst), "Claimable if registered")}
    ${kpi("Biggest category", top ? esc(top[0]) : "-", top ? p(top[1]) : "No expenses yet")}
    ${kpi("Total recorded", String(all.length), "All time")}
  </div>
  <div class="card">
    <div class="card-h"><h2>Expenses</h2><div class="toolbar">
      <input id="expenseSearch" placeholder="Search vendor, category..." style="width:200px" value="${esc(state.expenseQuery || "")}">
      <button class="btn sm primary" id="newExpenseBtn">Add expense</button></div></div>
    <div class="card-b" style="padding:0"><table>
      <thead><tr><th>Date</th><th>Vendor</th><th>Category</th><th class="num">Net</th><th class="num">${esc(taxNoun())}</th><th class="num">Total</th><th>Paid from</th><th></th></tr></thead>
      <tbody>${rows.map((e) => `<tr>
        <td class="mono">${esc(e.date)}</td><td>${esc(e.vendorName || "-")}<div class="subtle mono">${esc(e.reference || "")}</div></td>
        <td>${esc(e.category)}</td><td class="num">${p(e.netPaise)}</td><td class="num">${p(e.gstPaise)}</td><td class="num"><b>${p(e.totalPaise)}</b></td>
        <td>${esc(bankName(e.paidFrom))}</td>
        <td class="toolbar"><button class="btn sm" data-editexp="${e.id}">Edit</button><button class="btn sm danger" data-delexp="${e.id}">Delete</button></td>
      </tr>`).join("") || `<tr><td colspan="8" class="empty">No expenses recorded. Add one or match a bank debit.</td></tr>`}</tbody>
    </table></div>
  </div>
  <div class="card">
    <div class="card-h"><h2>By category · ${esc(state.period)}</h2></div>
    <div class="card-b"><table><tbody>${Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([cat, amt]) => `<tr><td style="width:190px">${esc(cat)}</td><td><div style="background:var(--accent-soft,#e8eefc);height:10px;border-radius:6px;width:${Math.round((amt / maxCat) * 100)}%"></div></td><td class="num">${p(amt)}</td></tr>`).join("") || `<tr><td class="empty">No expenses this month.</td></tr>`}</tbody></table></div>
  </div>
  <div class="card"><div class="card-b"><div class="subtle">Every expense posts a balanced journal: the expense account and input ${esc(taxNoun())} are debited, and the bank or cash account is credited. Input tax credit is tracked but you should confirm eligibility with your accountant.</div></div></div>`;
}

function openExpenseModal(id, opts) {
  if (!can("write")) return toast("Read-only role: you cannot change ledger data", "err");
  const e = id ? (state.expenses || []).find((x) => x.id === id) : null;
  const o = opts || {};
  const close = openDrawer(e ? "Edit expense" : "Add expense", `
    <div class="field"><label class="f">Date</label><input id="ex_date" type="date" value="${esc(e ? e.date : (o.date || todayISO))}"></div>
    <div class="field"><label class="f">Vendor</label><select id="ex_vendor">${vendorOptions(e ? e.vendorId : o.vendorId)}</select></div>
    <div class="field"><label class="f">Category</label><select id="ex_cat">${selectOptions(EXPENSE_CATEGORIES, e ? e.category : (o.category || "Software & subscriptions"))}</select></div>
    <div class="field"><label class="f">Net amount (${esc(state.settings.currency)})</label><input id="ex_net" value="${esc(e ? (e.netPaise / 100).toString() : (o.netRupees || ""))}" placeholder="e.g. 45000"></div>
    <div class="field"><label class="f">${esc(taxNoun())} rate %</label><input id="ex_gst" value="${esc(e ? String(e.gstRate ?? 0) : String(o.gstRate ?? 18))}"></div>
    <div class="field"><label class="f">Paid from</label><select id="ex_from">${accountOptions(e ? e.paidFrom : o.paidFrom)}</select></div>
    <div class="field"><label class="f">Reference</label><input id="ex_ref" value="${esc(e ? e.reference || "" : o.reference || "")}"></div>
    <div class="field"><label class="f">Receipt / supporting document</label>
      <input type="file" id="ex_receipt">
      <div id="ex_receipt_list">${attachmentsForExpense(e ? e.id : "").map((a) => `<div class="subtle" style="margin-top:4px">${esc(a.name)} · <a href="${esc(a.dataUrl)}" download="${esc(a.name)}" rel="noopener">open</a></div>`).join("") || `<div class="subtle">No receipt attached.</div>`}</div>
    </div>
    <div class="subtle">Posts: debit expense + input ${esc(taxNoun())}, credit bank/cash. No money is moved by this app.</div>`,
    `<button class="btn" id="ex_cancel">Cancel</button><button class="btn primary" id="ex_save">${e ? "Save changes" : "Add expense"}</button>`);
  el("ex_cancel").onclick = close;
  const expId = e ? e.id : newId("exp");
  const exRec = el("ex_receipt"); if (exRec) exRec.onchange = async () => { const f = exRec.files && exRec.files[0]; exRec.value = ""; if (f) { const att = await addAttachment(f, { expenseId: expId, kind: "receipt" }); if (att) { if (e) e.receipt = att.id; const list = el("ex_receipt_list"); if (list) list.innerHTML = attachmentsForExpense(expId).map((a) => `<div class="subtle" style="margin-top:4px">${esc(a.name)} · <a href="${esc(a.dataUrl)}" download="${esc(a.name)}" rel="noopener">open</a></div>`).join("") || `<div class="subtle">No receipt attached.</div>`; toast("Receipt attached", "ok"); saveState(); } } };
  el("ex_save").onclick = () => {
    const netPaise = toPaise(el("ex_net").value || 0);
    if (netPaise <= 0) return toast("Amount must be greater than zero", "err");
    if (!guardPeriod(el("ex_date").value || todayISO, "Expense")) return;
    const gstRate = Math.max(0, Number(el("ex_gst").value) || 0);
    const gstPaise = Math.round((netPaise * gstRate) / 100);
    const vendorId = el("ex_vendor").value;
    const rec = {
      id: expId, date: el("ex_date").value || todayISO, vendorId: vendorId || null,
      vendorName: (state.vendors.find((v) => v.id === vendorId) || {}).name || "Uncategorised vendor",

      paidFrom: el("ex_from").value, reference: el("ex_ref").value.trim(), receipt: e ? e.receipt : (attachmentsForExpense(expId)[0]?.id || null),
    };
    if (e) { const before = auditSnapshot(e); Object.assign(e, rec); recordChange("expense.edit", `${rec.vendorName} ${p(rec.totalPaise)}`, before, e); }
    else { state.expenses.push(rec); recordChange("expense.create", `${rec.vendorName} ${p(rec.totalPaise)}`, null, rec); }
    if (o.bankTxnId) { const t = state.bankTxns.find((x) => x.id === o.bankTxnId); if (t) { t.status = "matched"; t.matchedType = "expense"; t.matchedId = rec.id; } }
    saveState(); close(); render(); toast(e ? "Expense updated" : "Expense added", "ok");
  };
}

function removeExpense(id) {
  const e = (state.expenses || []).find((x) => x.id === id); if (!e) return;
  confirmAction({ title: "Delete this expense?", body: `This removes the ${p(e.totalPaise)} ${e.category} entry and its ledger posting. The bank line stays as a record.`, confirmLabel: "Delete expense", onConfirm: () => {
    state.expenses = state.expenses.filter((x) => x.id !== id);
    for (const t of state.bankTxns) if (t.matchedType === "expense" && t.matchedId === id) { t.status = "unmatched"; t.matchedType = null; t.matchedId = null; }
    logActivity("expense.delete", `${e.vendorName} ${p(e.totalPaise)}`);
    saveState(); render(); toast("Expense deleted", "");
  } });
}

// --- Bills / payable -------------------------------------------------------

function viewBills() {
  const bills = (state.bills || []).slice().sort((a, b) => (a.dueDate < b.dueDate ? -1 : 1));
  const open = bills.reduce((a, b) => a + billOpen(b), 0);
  const overdue = bills.filter((b) => billOpen(b) > 0 && b.dueDate < todayISO).reduce((a, b) => a + billOpen(b), 0);
  const soon = bills.filter((b) => billOpen(b) > 0 && b.dueDate >= todayISO && (ageDays(b.dueDate) || 0) >= -7).reduce((a, b) => a + billOpen(b), 0);
  return `
  <div class="grid kpi">
    ${kpi("Total payable", p(open), `${bills.filter((b) => billOpen(b) > 0).length} open bill${bills.filter((b) => billOpen(b) > 0).length === 1 ? "" : "s"}`)}
    ${kpi("Overdue", p(overdue), overdue ? "Pay to avoid supplier friction" : "Nothing overdue")}
    ${kpi("Due within 7 days", p(soon), soon ? "Plan the cash" : "Nothing due soon")}
    ${kpi("Paid this period", p((state.billPayments || []).filter((x) => x.date.slice(0, 7) === state.period).reduce((a, x) => a + x.amountPaise, 0)), "Vendor payments")}
  </div>
  <div class="card">
    <div class="card-h"><h2>Bills &amp; payables</h2><div class="toolbar"><button class="btn sm primary" id="newBillBtn">Add bill</button></div></div>
    <div class="card-b" style="padding:0"><table>
      <thead><tr><th>Bill</th><th>Vendor</th><th>Date</th><th>Due</th><th class="num">Total</th><th class="num">Paid</th><th class="num">Balance</th><th>Status</th><th></th></tr></thead>
      <tbody>${bills.map((b) => {
        const bal = billOpen(b);
        const late = bal > 0 && b.dueDate < todayISO;
        return `<tr>
          <td class="mono">${esc(b.number)}</td><td>${esc(b.vendorName)}<div class="subtle">${esc(b.category)}</div></td>
          <td class="mono">${esc(b.date)}</td><td class="mono" style="${late ? "color:var(--urgent)" : ""}">${esc(b.dueDate)}</td>
          <td class="num">${p(b.totalPaise)}</td><td class="num">${p(billPaid(b))}</td><td class="num"><b>${p(bal)}</b></td>
          <td>${bal <= 0 ? `<span class="badge b-good">paid</span>` : late ? `<span class="badge b-urgent">overdue</span>` : `<span class="badge b-warn">open</span>`}</td>
          <td class="toolbar">${bal > 0 ? `<button class="btn sm primary" data-paybill="${b.id}">Pay</button>` : ""}<button class="btn sm danger" data-delbill="${b.id}">Delete</button></td>
        </tr>`;
      }).join("") || `<tr><td colspan="9" class="empty">No bills recorded.</td></tr>`}</tbody>
    </table></div>
  </div>
  <div class="card"><div class="card-b"><div class="subtle">A bill records what a vendor charged you before you pay it: debit the expense + input ${esc(taxNoun())}, credit accounts payable. Paying it clears payable against the bank account. No payment is ever made by this app.</div></div></div>`;
}

    `<button class="btn" id="bp_cancel">Cancel</button><button class="btn primary" id="bp_save">Record payment</button>`);
  el("bp_cancel").onclick = close;
  el("bp_save").onclick = () => {
    const amountPaise = toPaise(el("bp_amt").value || 0);
    if (amountPaise <= 0) return toast("Amount must be greater than zero", "err");
    const accountId = el("bp_acct").value;
    const date = el("bp_date").value || todayISO;
    const reference = el("bp_ref").value.trim();
    state.billPayments.push({ id: newId("bp"), billId, date, amountPaise, accountId, reference });

          <td><button class="btn sm" data-vendor="${v.id}">Open</button></td>

      }).join("") || `<tr><td colspan="6" class="empty">No vendors yet.</td></tr>`}</tbody>

    <div class="card-b" style="padding:0"><table>

      <tbody>${(state.subscriptions || []).map((s) => `<tr>

    </table></div>

}

function openVendorDetail(id) {
  const v = (state.vendors || []).find((x) => x.id === id); if (!v) return;
  const bills = (state.bills || []).filter((b) => b.vendorId === id);
  const exps = (state.expenses || []).filter((e) => e.vendorId === id);
  const payable = bills.reduce((a, b) => a + billOpen(b), 0);
  const close = openDrawer(v.name, `
    <div class="row c3">${mini("Spend (month)", p(vendorSpend(v.id, state.period + "-01", state.period + "-31")))}${mini("Payable", p(payable))}${mini("Entries", String(bills.length + exps.length))}</div>
    <div class="subtle" style="margin-top:10px">${esc(v.email || "")} · ${esc(idNoun())} ${esc(v.gstin || "-")} · ${esc(v.category || "")}</div>
    <div class="sub" style="margin:14px 0 6px"><b>Bills</b></div>
    <table><tbody>${bills.map((b) => `<tr><td class="mono">${esc(b.number)}</td><td class="mono">${esc(b.dueDate)}</td><td class="num">${p(b.totalPaise)}</td><td>${billOpen(b) > 0 ? `<span class="badge b-warn">open ${p(billOpen(b))}</span>` : `<span class="badge b-good">paid</span>`}</td></tr>`).join("") || `<tr><td class="empty">No bills.</td></tr>`}</tbody></table>
    <div class="sub" style="margin:14px 0 6px"><b>Expenses</b></div>
    <table><tbody>${exps.map((e) => `<tr><td class="mono">${esc(e.date)}</td><td>${esc(e.category)}</td><td class="num">${p(e.totalPaise)}</td></tr>`).join("") || `<tr><td class="empty">No expenses.</td></tr>`}</tbody></table>`,
    `<button class="btn" id="ven_close">Close</button><button class="btn" id="ven_edit">Edit vendor</button>`);
  el("ven_close").onclick = close;
  el("ven_edit").onclick = () => { close(); openVendorModal(id); };
}

function openVendorModal(id) {
  if (!can("write")) return toast("Read-only role: you cannot change ledger data", "err");
  const v = id ? (state.vendors || []).find((x) => x.id === id) : null;
  const close = openDrawer(v ? "Edit vendor" : "Add vendor", `
    <div class="field"><label class="f">Name</label><input id="v_name" value="${esc(v ? v.name : "")}"></div>
    <div class="field"><label class="f">Category</label><select id="v_cat">${selectOptions(EXPENSE_CATEGORIES, v ? v.category : "Software & subscriptions")}</select></div>
    <div class="field"><label class="f">${esc(idNoun())}</label><input id="v_gstin" value="${esc(v ? v.gstin || "" : "")}"></div>
    <div class="field"><label class="f">Email</label><input id="v_email" value="${esc(v ? v.email || "" : "")}"></div>`,
    `<button class="btn" id="v_cancel">Cancel</button><button class="btn primary" id="v_save">${v ? "Save" : "Add vendor"}</button>`);
  el("v_cancel").onclick = close;
  el("v_save").onclick = () => {
    const name = el("v_name").value.trim();
    if (!name) return toast("A vendor needs a name", "err");
    const rec = { name, category: el("v_cat").value, gstin: el("v_gstin").value.trim().toUpperCase(), email: el("v_email").value.trim() };
    if (v) Object.assign(v, rec); else state.vendors.push({ id: newId("ven"), ...rec });
    logActivity(v ? "vendor.edit" : "vendor.create", name);
    saveState(); close(); render(); toast(v ? "Vendor updated" : "Vendor added", "ok");
  };
}



// --- Financial statements --------------------------------------------------

const STATEMENT_TABS = [["pl", "Profit & loss"], ["bs", "Balance sheet"], ["cf", "Cash flow"], ["tb", "Trial balance"], ["ar", "Receivables aging"], ["ap", "Payables aging"], ["rev", "Sales by customer"], ["exp", "Expenses by category"], ["hsn", "HSN / SAC"], ["return", "Tax return"], ["tax", "Tax summary"]];

function stmtLines(title, lines) {
  const total = lines.reduce((a, l) => a + l.amountPaise, 0);
  return `<div class="card" style="box-shadow:none"><div class="card-h"><h2 style="font-size:13px">${esc(title)}</h2></div>
    <div class="card-b" style="padding:0"><table><tbody>
      ${lines.map((l) => `<tr><td><button class="btn sm" data-glaccount="${esc(l.code)}">${esc(l.name)}</button><span class="subtle mono"> ${esc(l.code)}</span></td><td class="num">${p(l.amountPaise)}</td></tr>`).join("") || `<tr><td class="empty">Nothing here.</td></tr>`}
      <tr><td><b>${esc(title)} total</b></td><td class="num"><b>${p(total)}</b></td></tr>
    </tbody></table></div></div>`;
}

function statementCsv(tab, period) {
  const js = allJournals();
  const from = period + "-01", to = period + "-31";
  const rows = [];
  if (tab === "pl") {
    const pl = profitAndLoss(js, state.coa, { from, to });
    rows.push(["Section", "Code", "Account", "AmountPaise"]);
    for (const l of pl.revenueLines) rows.push(["Revenue", l.code, l.name, l.amountPaise]);
    for (const l of pl.cogsLines) rows.push(["Cost of services", l.code, l.name, l.amountPaise]);
    for (const l of pl.expenseLines) rows.push(["Operating expenses", l.code, l.name, l.amountPaise]);
    rows.push(["Gross profit", "", "", pl.grossProfitPaise], ["Net profit", "", "", pl.netProfitPaise]);
  } else if (tab === "bs") {
    const bs = balanceSheet(js, state.coa);
    rows.push(["Section", "Code", "Account", "AmountPaise"]);
    for (const l of bs.assetLines) rows.push(["Assets", l.code, l.name, l.amountPaise]);
    for (const l of bs.liabilityLines) rows.push(["Liabilities", l.code, l.name, l.amountPaise]);
    for (const l of bs.equityLines) rows.push(["Equity", l.code, l.name, l.amountPaise]);
    rows.push(["Retained (net profit)", "", "", bs.netProfitPaise]);
  } else if (tab === "cf") {
    const cf = cashFlow(js, state.coa, { from, to });
    rows.push(["Activity", "AmountPaise"], ["Operating", cf.operatingPaise], ["Investing", cf.investingPaise], ["Financing", cf.financingPaise], ["Net change", cf.netChangePaise]);
  } else if (tab === "tb") {
    const tb = trialBalance(js, state.coa);
    rows.push(["Code", "Account", "Type", "DebitPaise", "CreditPaise"]);
    for (const r of tb.rows) rows.push([r.code, r.name, r.type, r.debitPaise, r.creditPaise]);
  } else if (tab === "ar" || tab === "ap") {
    const items = tab === "ar"
      ? state.invoices.filter((i) => !isVoid(i) && openBalance(i) > 0).map((i) => ({ amountPaise: openBalance(i), dueDate: i.dueDate }))
      : (state.bills || []).filter((b) => billOpen(b) > 0).map((b) => ({ amountPaise: billOpen(b), dueDate: b.dueDate }));
    const b = agingBuckets(items, { today: todayISO });
    rows.push(["Band", "AmountPaise"], ["Current", b.current], ["1-30", b.d1_30], ["31-60", b.d31_60], ["61-90", b.d61_90], ["90+", b.d90plus], ["Total", b.total]);
  } else if (tab === "rev") {
    const by = {};
    for (const inv of state.invoices) { if (isVoid(inv) || inv.date.slice(0, 7) !== period) continue; by[inv.clientName] = (by[inv.clientName] || 0) + inv.totals.taxablePaise; }
    rows.push(["Customer", "TaxablePaise"]);
    for (const [n, v] of Object.entries(by).sort((a, b) => b[1] - a[1])) rows.push([n, v]);
  } else if (tab === "exp") {
    const by = {};
    for (const e of state.expenses || []) if (e.date.slice(0, 7) === period) by[e.category] = (by[e.category] || 0) + e.netPaise;
    for (const b of state.bills || []) if (b.date.slice(0, 7) === period) by[b.category] = (by[b.category] || 0) + b.netPaise;
    rows.push(["Category", "NetPaise"]);
    for (const [c, v] of Object.entries(by).sort((a, b) => b[1] - a[1])) rows.push([c, v]);
  } else if (tab === "hsn") {
    rows.push(["HSN/SAC", "Rate", "Lines", "TaxablePaise", "TaxPaise"]);
    for (const r of hsnSummary()) rows.push([r.hsnSac, r.gstRate, r.count, r.taxablePaise, r.taxPaise]);
  } else if (tab === "return") {
    const r = taxReturnSummary();
    rows.push(["Direction", "Rate", "Count", "TaxablePaise", "TaxPaise"]);
    for (const [rate, v] of Object.entries(r.outward)) rows.push(["Outward", rate, v.count, v.taxablePaise, v.taxPaise]);
    for (const [rate, v] of Object.entries(r.inward)) rows.push(["Inward", rate, v.count, v.taxablePaise, v.taxPaise]);
  } else {
    const out = outputTaxPaise(), inp = inputTaxPaise();
    rows.push(["Item", "AmountPaise"], ["Output tax", out], ["Input tax", inp], ["Net", out - inp]);
  }
  const csv = rows.map((r) => r.map((v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`).join(",")).join("\n");
  return { filename: `aurora-${tab}-${period}.csv`, csv };
}

function exportStatementCsv() {
  const tab = state.statementTab || "pl";
  const { filename, csv } = statementCsv(tab, state.period);
  downloadText(filename, csv, "text/csv");
  toast(`Exported ${STATEMENT_TABS.find(([id]) => id === tab)?.[1] || tab} CSV`, "ok");
}

      <div class="card"><div class="card-h"><h2>Cash flow · ${esc(state.period)}</h2></div><div class="card-b" style="padding:0"><table><tbody>

      <tbody>${tb.rows.filter((r) => r.debitPaise || r.creditPaise).map((r) => `<tr><td><button class="btn sm" data-glaccount="${esc(r.code)}">${esc(r.name)}</button> <span class="subtle mono">${esc(r.code)}</span></td><td>${esc(r.type)}</td><td class="num">${r.debitPaise ? p(r.debitPaise) : ""}</td><td class="num">${r.creditPaise ? p(r.creditPaise) : ""}</td></tr>`).join("")}
      <tr><td><b>Total</b></td><td></td><td class="num"><b>${p(tb.totalDebitPaise)}</b></td><td class="num"><b>${p(tb.totalCreditPaise)}</b></td></tr></tbody></table></div></div>`;

      : (state.bills || []).filter((b) => billOpen(b) > 0).map((b) => ({ amountPaise: billOpen(b), dueDate: b.dueDate }));

      <div class="card"><div class="card-h"><h2>${tab === "ar" ? "Receivables" : "Payables"} aging</h2></div><div class="card-b" style="padding:0"><table><thead><tr><th>Band</th><th class="num">Amount</th></tr></thead><tbody>

  return `
  <div class="card"><div class="card-h"><h2>Financial statements</h2><span class="hint">${esc(state.period)} · from the double-entry ledger</span></div>
    <div class="card-b"><div class="toolbar">${STATEMENT_TABS.map(([id, label]) => `<button class="btn sm ${id === tab ? "primary" : ""}" data-stmt="${id}">${esc(label)}</button>`).join("")}<button class="btn sm" data-stmtexport>Export tab CSV</button></div></div></div>
  ${body}
  <div class="card"><div class="card-b"><div class="subtle">These statements are generated from every posted journal, including journals derived automatically from your invoices, payments, expenses and bills. Amounts in a foreign currency are not yet posted to the ledger and are excluded here.</div></div></div>`;
}

function openAccountModal() {
  const close = openDrawer("Add account", `

// --- Journal ---------------------------------------------------------------

function pageSlice(items, pageKey, pageSize) {
  const page = Math.max(1, Number(state[pageKey]) || 1);
  const pages = Math.max(1, Math.ceil(items.length / pageSize));
  const current = Math.min(page, pages);
  return { page: current, pages, slice: items.slice((current - 1) * pageSize, current * pageSize) };
}

function pagerHtml(pageKey, page, pages, total) {
  if (pages <= 1) return "";
  return `<div class="toolbar" style="justify-content:flex-end;margin-top:8px">
    <button class="btn sm" data-page="${esc(pageKey)}" data-pagedir="-1" ${page <= 1 ? "disabled" : ""}>Prev</button>
    <span class="subtle">Page ${page} of ${pages} · ${total} rows</span>
    <button class="btn sm" data-page="${esc(pageKey)}" data-pagedir="1" ${page >= pages ? "disabled" : ""}>Next</button></div>`;
}

function viewJournal() {
  const js = allJournals().slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  const ps = pageSlice(js, "journalPage", 50);
  const pending = pendingJournals();
  const held = (state.journals || []).filter((j) => j.approval && j.approval.status !== "approved");
  return `
  <div class="grid kpi">${mini("Journals", String(js.length))}${mini("Manual", String((state.journals || []).length))}${mini("Awaiting approval", String(pending.length))}${mini("Balanced", String(js.filter((j) => validateJournal(j).balanced).length))}</div>
  <div class="card">
    <div class="card-h"><h2>Journal</h2><div class="toolbar">
      ${can("close") ? `<label class="pill-row" style="gap:6px;cursor:pointer"><input type="checkbox" id="apprToggle" ${state.settings.requireApproval ? "checked" : ""} style="width:auto"> Require approval for manual entries</label>` : ""}
      ${can("write") ? `<button class="btn sm primary" id="newJournalBtn">New manual entry</button>` : ""}</div></div>
    <div class="card-b" style="padding:0"><table>
      <thead><tr><th>Date</th><th>Ref</th><th>Memo</th><th>Source</th><th class="num">Debit</th><th class="num">Credit</th><th></th></tr></thead>
      <tbody>${ps.slice.map((j) => {
        const d = j.lines.reduce((a, l) => a + (l.debitPaise || 0), 0);
        const c = j.lines.reduce((a, l) => a + (l.creditPaise || 0), 0);
        const generated = j.source && j.source !== "manual";
        return `<tr><td class="mono">${esc(j.date)}</td><td class="mono">${esc(j.ref || "")}</td><td>${esc(j.memo || "")}</td>
          <td><span class="badge ${generated ? "b-muted" : "b-good"}">${esc(j.source || "manual")}</span></td>
          <td class="num">${p(d)}</td><td class="num">${p(c)}</td>
          <td><button class="btn sm" data-journal="${esc(j.id)}">View</button></td></tr>`;
      }).join("") || `<tr><td colspan="7" class="empty">No journals yet.</td></tr>`}</tbody>
    </table></div>
    ${pagerHtml("journalPage", ps.page, ps.pages, js.length)}
  </div>
  ${held.length ? `<div class="card">
    <div class="card-h"><h2>Held for approval</h2><span class="hint">Not posted to the ledger until approved</span></div>
    <div class="card-b" style="padding:0"><table>
      <thead><tr><th>Date</th><th>Ref</th><th>Memo</th><th>Status</th><th class="num">Amount</th><th></th></tr></thead>
      <tbody>${held.map((j) => {
        const amt = j.lines.reduce((a, l) => a + (l.debitPaise || 0), 0);
        return `<tr><td class="mono">${esc(j.date)}</td><td class="mono">${esc(j.ref || "")}</td><td>${esc(j.memo || "")}</td>
          <td><span class="badge ${j.approval.status === "rejected" ? "b-urgent" : "b-warn"}">${esc(j.approval.status)}</span></td>
          <td class="num">${p(amt)}</td>
          <td>${j.approval.status === "pending" && can("approve") ? `<button class="btn sm primary" data-approve="${esc(j.id)}">Approve</button> <button class="btn sm danger" data-reject="${esc(j.id)}">Reject</button>` : `<button class="btn sm" data-journal="${esc(j.id)}">View</button>`}</td></tr>`;
      }).join("")}</tbody>
    </table></div>
  </div>` : ""}
  <div class="card"><div class="card-b"><div class="subtle">Journals tagged invoice, payment, expense, bill or bill_payment are generated automatically from those records and cannot be edited here. Manual entries are yours to add. With approval required, a new manual entry is held out of the ledger until an owner or accountant approves it. Every posted entry must balance to the paise.</div></div></div>`;

function openJournalDrawer(id) {

    <div class="${d === c ? "okline" : "flag"}" style="margin-top:10px">${d === c ? "Balanced." : `Out of balance by ${p(Math.abs(d - c))}.`}</div>

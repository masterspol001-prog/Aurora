function openJournalModal() {
  if (!can("write")) return toast("Read-only role: you cannot change ledger data", "err");
  const accounts = state.coa.map((a) => `<option value="${esc(a.code)}">${esc(a.code)} ${esc(a.name)}</option>`).join("");
  const lineRow = () => `<tr>
    <td><select class="jl_acct">${accounts}</select></td>
    <td><input class="jl_debit" placeholder="0" style="width:110px"></td>
    <td><input class="jl_credit" placeholder="0" style="width:110px"></td></tr>`;
  const close = openDrawer("New manual journal entry", `
    <div class="field"><label class="f">Date</label><input id="jm_date" type="date" value="${todayISO}"></div>
    <div class="field"><label class="f">Reference / memo</label><input id="jm_memo" placeholder="e.g. Owner's capital introduced"></div>
    <table id="jm_lines"><thead><tr><th>Account</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead><tbody>${lineRow()}${lineRow()}</tbody></table>
    <div class="advice" style="margin-top:10px"><button class="btn sm" id="jm_addline">Add line</button></div>
    <div id="jm_check" class="subtle" style="margin-top:8px">Enter debits and credits; they must balance.</div>`,
    `<button class="btn" id="jm_cancel">Cancel</button><button class="btn primary" id="jm_save">Post entry</button>`);
  el("jm_cancel").onclick = close;
  el("jm_addline").onclick = () => { const tb = el("jm_lines").querySelector("tbody"); tb.insertAdjacentHTML("beforeend", lineRow()); };
  const readLines = () => Array.from(el("jm_lines").querySelectorAll("tbody tr")).map((tr) => ({
    account: tr.querySelector(".jl_acct").value,
    debitPaise: toPaise(tr.querySelector(".jl_debit").value || 0),
    creditPaise: toPaise(tr.querySelector(".jl_credit").value || 0),
  })).filter((l) => l.debitPaise || l.creditPaise);
  const refresh = () => { const ls = readLines(); const d = ls.reduce((a, l) => a + l.debitPaise, 0); const c = ls.reduce((a, l) => a + l.creditPaise, 0); const ck = el("jm_check"); if (ck) { ck.className = d && d === c ? "okline" : "subtle"; ck.textContent = d === c && d > 0 ? `Balanced at ${p(d)}.` : `Debits ${p(d)} vs credits ${p(c)}.`; } };
  el("jm_lines").oninput = refresh;
  el("jm_save").onclick = () => {
    const lines = readLines();
    const check = validateJournal({ lines });
    if (!check.balanced) return toast(check.errors[0] || "Entry does not balance", "err");
    const jdate = el("jm_date").value || todayISO;
    if (!guardPeriod(jdate, "Journal")) return;
    const entry = { id: newId("jrnl"), date: jdate, ref: el("jm_memo").value.trim() || "JOURNAL", memo: el("jm_memo").value.trim(), source: "manual", createdBy: state.role || "owner", lines };
    if (requiresApproval("journal")) entry.approval = { status: "pending", by: null, at: null, note: "" };
    state.journals.push(entry);
    recordChange("journal.create", entry.ref, null, entry, { reason: entry.approval ? "Submitted for approval" : "Posted" });
    saveState(); close(); render(); toast(entry.approval ? "Journal submitted for approval" : "Journal posted", "ok");
  };
}

// --- Ask Aurora (rule-based assistant over your own data) ------------------

const AI_SUGGESTIONS = ["How much cash do I have?", "Who owes me money?", "What do I owe vendors?", "Am I profitable this month?", "How much tax do I owe?", "What is my 30-day cash forecast?"];

function aiAnswer(q, d) {
  const s = (q || "").toLowerCase().trim();
  if (!s) return null;
  const k = financeKpis();
  const f = d.fin;
  const has = (...ws) => ws.some((w) => s.includes(w));
  const jrns = allJournals();
  if (has("cash", "bank", "runway", "forecast", "30-day", "60", "90")) return {
    title: "Cash and forecast",
    body: `Cash and bank today: ${p(k.cash)}. Over the next 30 days you expect about ${p(f[0].inflowPaise)} in and ${p(f[0].outflowPaise)} out (net ${p(f[0].netPaise)}). At 90 days the net is ${p(f[2].netPaise)}.`,
    why: `You asked about "${q}". This is answered from cash-account balances and dated commitments.`,
    sources: ["Bank accounts", "Invoices", "Bills", "Subscriptions"],
    calc: "Cash = sum of open bank-account balances. Forecast buckets dated inflows (unpaid invoice balances) and outflows (open bills, subscriptions, recurring) into 30/60/90-day windows.",
    txns: (state.bankAccounts || []).map((b) => ({ label: bankName(b.id), date: "", amountPaise: bankBalance(b), source: "bank", sourceId: b.id })),
    go: ["banking", "Banking"],
  };
  if (has("owe me", "receivable", "who owes", "collect", "outstanding", "customer")) return {
    title: "Receivables",
    body: `${p(k.ar)} is outstanding across your ${state.clients.length} customers. ${d.overdue.invoices.length} invoice${d.overdue.invoices.length === 1 ? " is" : "s are"} overdue${d.overdue.invoices.length ? ` (${p(d.overdue.totalPaise)})` : ""}.`,
    why: `You asked about money owed to you. This sums the unpaid balance of every live invoice.`,
    sources: ["Invoices", "Payments", "Credit notes"],
    calc: "Receivable = for each non-void invoice, total payable minus payments received and credit notes applied. Overdue = invoices whose due date is before today and still open.",
    txns: state.invoices.filter((i) => !isVoid(i) && openBalance(i) > 0).map((i) => ({ label: `${i.number} · ${i.clientName}`, date: i.dueDate, amountPaise: openBalance(i), source: "invoice", sourceId: i.id })),
    go: ["invoices", "Invoices"],
  };
  if (has("i owe", "payable", "vendor", "supplier", "bill")) return {
    title: "Payables",
    body: `You owe vendors ${p(k.ap)}. ${f[0].outflowPaise ? `About ${p(f[0].outflowPaise)} of commitments fall in the next 30 days.` : ""}`,
    why: `You asked about money you owe. This sums the unpaid balance of every bill.`,
    sources: ["Bills", "Bill payments"],
    calc: "Payable = for each bill, total minus payments recorded against it.",
    txns: (state.bills || []).filter((b) => billOpen(b) > 0).map((b) => ({ label: `${b.number || b.vendorName} · ${b.vendorName}`, date: b.dueDate, amountPaise: billOpen(b), source: "bill", sourceId: b.id })),
    go: ["bills", "Bills"],
  };
  if (has("profit", "profitable", "margin", "p&l", "income")) return {
    title: "Profit this month",
    body: `Revenue is ${p(k.revenue)} and costs (expenses + cost of services) are ${p(k.expenses)}, so the estimated net profit for ${state.period} is ${p(k.profit)}.`,
    why: `You asked whether you are profitable. This reads the profit & loss built from posted journals for ${state.period}.`,
    sources: ["Journals", "Invoices", "Expenses", "Bills"],
    calc: "Revenue (credit movement on revenue accounts) minus cost of services and operating expenses (debit movement on those accounts), for the selected month.",
    txns: jrns.filter((j) => ((j.date || "").slice(0, 7) === state.period) && ["invoice", "credit_note", "expense", "bill", "manual"].includes(j.source)).slice(0, 50).map((j) => ({ label: j.memo || j.ref || j.source, date: j.date, source: j.source, sourceId: j.sourceId })),
    go: ["statements", "Statements"],
  };
  if (has("tax", "gst", "tds", "vat")) return {
    title: "Tax position",
    body: `Output ${taxNoun()} is ${p(k.outputTax)}, input ${taxNoun()} plus credits is ${p(k.inputTax)}, so the net ${k.netTax >= 0 ? "payable" : "credit carried forward"} is ${p(Math.abs(k.netTax))}. This is a computed figure, not a filing.`,
    why: `You asked about tax. This nets the tax on your sales against tax on purchases and withholding credits.`,
    sources: ["Invoices", "Expenses", "Bills", "Payments"],
    calc: `Output ${taxNoun()} from invoice tax components, minus input ${taxNoun()} on expenses and bills and TDS deducted on receipts, for ${state.period}.`,
    txns: state.invoices.filter((i) => !isVoid(i) && i.date.slice(0, 7) === state.period).map((i) => ({ label: `${i.number} · ${i.clientName}`, date: i.date, amountPaise: taxTotalOf(i.totals), source: "invoice", sourceId: i.id })),
    go: ["taxes", "Taxes"],
  };
  if (has("expense", "spend", "spent", "cost")) {
    const cats = {}; for (const e of periodExpenses()) cats[e.category] = (cats[e.category] || 0) + e.netPaise;
    const top = Object.entries(cats).sort((a, b) => b[1] - a[1])[0];
    return {
      title: "Spending",
      body: `You have spent ${p(periodExpenses().reduce((a, e) => a + e.totalPaise, 0))} this month${top ? `, mostly on ${top[0]} (${p(top[1])})` : ""}.`,
      why: `You asked about spending. This totals expenses recorded in ${state.period} by category.`,
      sources: ["Expenses"],
      calc: "Sum of expense totals for the selected month, grouped by category (before tax for the category breakdown).",
      txns: (state.expenses || []).filter((e) => e.date.slice(0, 7) === state.period).map((e) => ({ label: `${e.vendorName} · ${e.category}`, date: e.date, amountPaise: e.totalPaise, source: "expense", sourceId: e.id })),
      go: ["expenses", "Expenses"],
    };
  }
  if (has("invoice", "chase", "remind", "late")) return {
    title: "Getting paid",
    body: `${d.overdue.invoices.length} invoice${d.overdue.invoices.length === 1 ? "" : "s"} need attention totalling ${p(d.overdue.totalPaise)}.`,
    why: `You asked about chasing payment. This lists invoices that are past due and still open.`,
    sources: ["Invoices", "Payments"],
    calc: "Overdue = invoices with an open balance and a due date earlier than today.",
    txns: d.overdue.invoices.map((i) => ({ label: `${i.number} · ${i.clientName}`, date: i.dueDate, amountPaise: openBalance(i), source: "invoice", sourceId: i.id })),
    go: ["action", "Needs attention"],
  };
  if (has("balance", "statement", "net worth")) {
    const bs = balanceSheet(jrns, state.coa);
    return {
      title: "Financial statements",
      body: `Assets are ${p(bs.assetsPaise)} and the balance sheet is ${bs.balanced ? "in balance" : "out of balance"}.`,
      why: `You asked for a balance-sheet view. This aggregates all posted journals by account type.`,
      sources: ["Journals", "Chart of accounts"],
      calc: "Assets = net debit movement on asset accounts; liabilities and equity = net credit movement on those accounts. It must satisfy assets = liabilities + equity.",
      txns: [],
      go: ["statements", "Statements"],
    };
  }
  return { title: "I can help with that", body: "Try asking about cash, who owes you, what you owe, profit, tax, spending or the cash forecast. I answer only from the data in this workspace.", why: "I did not recognise that question, so I did not compute anything.", sources: [], calc: "No calculation performed.", txns: [], go: null };
}

function explainBlock(a) {
  if (!a || !a.why) return "";
  const txns = (a.txns || []).slice(0, 50);
  return `<details class="caveat" style="margin-top:10px"><summary>Why and how this was computed</summary>
    <div style="margin-top:8px"><b>Why</b><div class="subtle">${esc(a.why)}</div></div>
    <div style="margin-top:8px"><b>Sources read</b><div class="advice" style="margin-top:4px">${(a.sources || []).map((x) => `<span class="badge b-muted">${esc(x)}</span>`).join("") || `<span class="subtle">No records read.</span>`}</div></div>
    <div style="margin-top:8px"><b>Calculation</b><div class="subtle">${esc(a.calc)}</div></div>
    <div style="margin-top:8px"><b>Transactions behind it</b><div class="card-b" style="padding:0"><table><tbody>${txns.map((t) => `<tr><td>${esc(t.label)}</td><td class="subtle mono">${esc(t.date || "")}</td>${t.amountPaise == null ? "" : `<td class="num">${p(t.amountPaise)}</td>`}${t.sourceId ? `<td><button class="btn sm" data-opensrc="${esc(t.source)}|${esc(t.sourceId)}">open</button></td>` : `<td></td>`}</tr>`).join("") || `<tr><td class="subtle">No individual transactions to show for this answer.</td></tr>`}</tbody></table></div></div>
  </details>`;
}

function viewAssistant() {
  const d = { fin: cashForecast(), overdue: overdueSummary(), customers: state.clients.length };
  const a = aiAnswer(state.aiQuery, d);
  return `
  <div class="card">
    <div class="card-h"><h2>Ask Aurora</h2><span class="hint">Answers built from your data only</span></div>
    <div class="card-b">
      <div class="toolbar"><input id="aiInput" placeholder="e.g. How much cash do I have?" style="flex:1;min-width:220px" value="${esc(state.aiQuery || "")}"><button class="btn primary" id="aiAsk">Ask</button></div>
      <div class="advice" style="margin-top:10px">${AI_SUGGESTIONS.map((q) => `<button class="btn sm" data-aiquery="${esc(q)}">${esc(q)}</button>`).join("")}</div>
      ${a ? `<div class="card" style="box-shadow:none;margin-top:14px"><div class="card-b"><div class="sub"><b>${esc(a.title)}</b></div><div style="margin-top:6px">${esc(a.body)}</div>
        ${explainBlock(a)}
        ${a.go ? `<div class="advice" style="margin-top:10px"><button class="btn sm" data-go="${a.go[0]}">${esc(a.go[1])} &rarr;</button></div>` : ""}</div></div>` : `<div class="empty" style="margin-top:14px">Ask a question above. Aurora is rule-based and never invents figures - it reads your invoices, bills, expenses and bank feed.</div>`}
    </div>
  </div>
  <div class="card"><div class="card-b"><div class="subtle">This assistant is deterministic and reads only from this workspace. It does not call any external model and cannot change your data. For interpretation that needs judgement, confirm with your accountant.</div></div></div>`;
}

// --- Vendor & spend insights ----------------------------------------------

function viewInsights() {
  const prevPeriod = (() => { const d = new Date(state.period + "-01T00:00:00Z"); d.setUTCMonth(d.getUTCMonth() - 1); return d.toISOString().slice(0, 7); })();
  const cur = state.period + "-01", curEnd = state.period + "-31", prevEnd = prevPeriod + "-31";
  const spendCur = (state.expenses || []).filter((e) => e.date >= cur && e.date <= curEnd).reduce((a, e) => a + e.netPaise, 0);
  const spendPrev = (state.expenses || []).filter((e) => e.date >= prevPeriod + "-01" && e.date <= prevEnd).reduce((a, e) => a + e.netPaise, 0);
  const delta = spendPrev ? Math.round(((spendCur - spendPrev) / spendPrev) * 100) : null;
  const byVendor = {};
  for (const e of state.expenses || []) byVendor[e.vendorName] = (byVendor[e.vendorName] || 0) + e.netPaise;
  const subsTotal = (state.subscriptions || []).filter((s) => s.active !== false).reduce((a, s) => a + s.amountPaise, 0);
  const noReceipt = (state.expenses || []).filter((e) => !e.receipt);
  const largest = Object.entries(byVendor).sort((a, b) => b[1] - a[1])[0];
  const customerRev = {};
  for (const inv of state.invoices) { if (isVoid(inv)) continue; customerRev[inv.clientName] = (customerRev[inv.clientName] || 0) + inv.totals.taxablePaise; }
  const revTotal = Object.values(customerRev).reduce((a, x) => a + x, 0) || 1;
  const topCust = Object.entries(customerRev).sort((a, b) => b[1] - a[1])[0];
  const concentration = topCust ? Math.round((topCust[1] / revTotal) * 100) : 0;
  return `
  <div class="grid kpi">
    ${kpi("Spend this month", p(spendCur), delta == null ? "No prior month to compare" : `${delta >= 0 ? "+" : ""}${delta}% vs last month`)}
    ${kpi("Recurring commitments", p(subsTotal), "Every month, from subscriptions")}
    ${kpi("Largest vendor", largest ? largest[0] : "-", largest ? p(largest[1]) : "No vendor spend")}
    ${kpi("Customer concentration", topCust ? concentration + "%" : "-", topCust ? `Top customer: ${topCust[0]}` : "No revenue yet")}
  </div>
  <div class="grid two">
    <div class="card"><div class="card-h"><h2>Spend by vendor</h2><span class="hint">All time</span></div>
      <div class="card-b" style="padding:0"><table><tbody>${Object.entries(byVendor).sort((a, b) => b[1] - a[1]).map(([v, amt]) => `<tr><td>${esc(v)}</td><td class="num">${p(amt)}</td></tr>`).join("") || `<tr><td class="empty">No vendor spend recorded.</td></tr>`}</tbody></table></div></div>
    <div class="card"><div class="card-h"><h2>Recurring renewals</h2></div>
      <div class="card-b" style="padding:0"><table><tbody>${(state.subscriptions || []).map((s) => `<tr><td>${esc(s.name)}</td><td class="num">day ${s.dayOfMonth || 1}</td><td class="num">${p(s.amountPaise)}</td></tr>`).join("") || `<tr><td class="empty">No subscriptions tracked.</td></tr>`}</tbody></table></div></div>
  </div>
  ${concentration >= 40 && topCust ? `<div class="flag"><b>Concentration risk:</b> ${esc(topCust[0])} is ${concentration}% of all revenue. If that customer slows down, so does the business.</div>` : ""}
  <div class="card"><div class="card-h"><h2>Attention</h2></div><div class="card-b">
    <div class="${noReceipt.length ? "flag" : "okline"}">${noReceipt.length ? `${noReceipt.length} expense${noReceipt.length === 1 ? "" : "s"} have no receipt attached (${p(noReceipt.reduce((a, e) => a + e.totalPaise, 0))}).` : "Every expense has a supporting document, or none need one."}</div>
    <div class="advice" style="margin-top:10px"><button class="btn sm" data-go="expenses">Review expenses &rarr;</button><button class="btn sm" data-go="dataquality">Data quality &rarr;</button></div>
  </div></div>`;
}

// --- Data quality ----------------------------------------------------------

function viewDataQuality() {
  const checks = [];
  const dupNumbers = Object.entries(state.invoices.filter((i) => !isVoid(i)).reduce((m, i) => ((m[i.number] = (m[i.number] || 0) + 1), m), {})).filter(([, n]) => n > 1);
  checks.push({ ok: !dupNumbers.length, label: "No duplicate invoice numbers", detail: dupNumbers.map(([n, c]) => `${n} x${c}`).join(", ") });
  const missingClient = state.invoices.filter((i) => !isVoid(i) && !client(i.clientId));
  checks.push({ ok: !missingClient.length, label: "Every invoice is linked to a customer", detail: `${missingClient.length} orphaned` });
  const noTaxId = state.clients.filter((c) => !c.gstin && c.taxTreatment !== "individual");
  checks.push({ ok: !noTaxId.length, label: `Customers have a ${idNoun()} where expected`, detail: noTaxId.map((c) => c.name).join(", ") });
  const noContact = state.clients.filter((c) => !c.email);
  checks.push({ ok: !noContact.length, label: "Customers have a contact email", detail: noContact.map((c) => c.name).join(", ") });
  const unmatched = state.bankTxns.filter((t) => t.status === "unmatched");
  checks.push({ ok: !unmatched.length, label: "Bank feed fully reconciled", detail: `${unmatched.length} unmatched line${unmatched.length === 1 ? "" : "s"}` });
  const unbalanced = allJournals().filter((j) => !validateJournal(j).balanced);
  checks.push({ ok: !unbalanced.length, label: "Every journal balances", detail: `${unbalanced.length} out of balance` });
  const noReceipt = (state.expenses || []).filter((e) => !e.receipt);
  checks.push({ ok: !noReceipt.length, label: "Expenses have supporting documents", detail: `${noReceipt.length} missing` });
  const foreign = state.invoices.filter((i) => !isVoid(i) && !isBaseCurrency(i));
  checks.push({ ok: !foreign.length, label: "All invoices are in the base currency", detail: foreign.length ? `${foreign.length} foreign-currency invoice(s) not posted to the ledger` : "" });
  const bad = checks.filter((c) => !c.ok);
  return `
  <div class="grid kpi">${kpi("Checks passed", `${checks.length - bad.length}/${checks.length}`, "")}${kpi("Issues found", String(bad.length), bad.length ? "Worth a look" : "Everything checks out")}</div>
  <div class="card"><div class="card-h"><h2>Data quality</h2><span class="hint">Derived from your records</span></div>
    <div class="card-b" style="padding:0"><table><tbody>${checks.map((c) => `<tr><td style="width:26px">${c.ok ? `<span class="badge b-good">ok</span>` : `<span class="badge b-urgent">fix</span>`}</td><td>${esc(c.label)}</td><td class="subtle">${esc(c.detail || "")}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="card"><div class="card-b"><div class="subtle">These checks protect the integrity of your books. They are not a substitute for a professional review.</div></div></div>`;
}

// --- Traceability: drill from any number to its source and ledger ----------

const ymOffset = (ym, n) => { const d = new Date(ym + "-01T00:00:00Z"); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 7); };

const journalsForSource = (sourceId) => allJournals().filter((j) => j.sourceId === sourceId);

function openSourceDoc(source, sourceId) {
  if (!sourceId) return;
  if (source === "invoice") openInvoiceDetail(sourceId);
  else if (source === "expense") openExpenseModal(sourceId);
  else if (source === "bill") openBillModal(sourceId);
  else if (source === "payment") { const pay = state.payments.find((p) => p.id === sourceId); if (pay && pay.invoiceId) openInvoiceDetail(pay.invoiceId); else toast("This receipt has no linked invoice", ""); }
  else if (source === "credit_note") { const cn = (state.creditNotes || []).find((c) => c.id === sourceId); const inv = cn && state.invoices.find((i) => i.number === cn.invoiceNumber); if (inv) openInvoiceDetail(inv.id); else toast("Linked invoice not found", ""); }
  else if (source === "bill_payment") openBillModal(sourceId);
  else toast("No source document to open", "");
}

function generalLedgerRows(code, from, to) {
  const acct = (state.coa || []).find((a) => a.code === code);
  const normal = (ACCOUNT_TYPES[acct && acct.type] || {}).normal || "debit";
  const js = allJournals().filter((j) => (!from || j.date >= from) && (!to || j.date <= to)).sort((a, b) => (a.date < b.date ? -1 : 1));
  const rows = []; let run = 0;
  for (const j of js) for (const l of j.lines || []) if (l.account === code) {
    const signed = normal === "debit" ? (l.debitPaise || 0) - (l.creditPaise || 0) : (l.creditPaise || 0) - (l.debitPaise || 0);
    run += signed;
    rows.push({ date: j.date, ref: j.ref, memo: j.memo, source: j.source, sourceId: j.sourceId, debitPaise: l.debitPaise || 0, creditPaise: l.creditPaise || 0, balancePaise: run });
  }
  return { rows, account: acct, closingPaise: run };
}

function openGeneralLedger(code, from, to) {
  const g = generalLedgerRows(code, from, to);
  if (!g.account) return;
  const movement = g.rows.reduce((a, r) => a + r.debitPaise - r.creditPaise, 0);
  const close = openDrawer(`Ledger · ${g.account.code} ${g.account.name}`, `
    <div class="row c3">${mini("Movement", p(movement))}${mini("Entries", String(g.rows.length))}${mini("Closing", p(g.closingPaise))}</div>
    <table style="margin-top:12px"><thead><tr><th>Date</th><th>Ref</th><th>Memo</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead>
    <tbody>${g.rows.map((r) => `<tr><td class="mono">${esc(r.date)}</td><td class="mono">${esc(r.ref || "")}</td><td>${esc(r.memo || "")}${r.sourceId ? ` <button class="btn sm" data-glsource="${esc(r.source)}|${esc(r.sourceId)}">source</button>` : ""}</td><td class="num">${r.debitPaise ? p(r.debitPaise) : ""}</td><td class="num">${r.creditPaise ? p(r.creditPaise) : ""}</td><td class="num">${p(r.balancePaise)}</td></tr>`).join("") || `<tr><td colspan="6" class="empty">No movement in this range.</td></tr>`}</tbody></table>`,
    `<button class="btn" id="gl_close">Close</button>`);
  el("gl_close").onclick = close;
  document.querySelectorAll("#modalRoot [data-glsource]").forEach((b) => { b.onclick = () => { const [s, id] = b.dataset.glsource.split("|"); close(); openSourceDoc(s, id); }; });
}

// --- Smart alerts (derived, explainable) -----------------------------------

function smartAlerts() {
  const out = [];
  const od = overdueSummary();
  if (od.invoices.length) out.push({ level: "high", title: `${od.invoices.length} overdue invoice${od.invoices.length === 1 ? "" : "s"}`, why: `${p(od.totalPaise)} is past its due date.`, go: ["invoices", "Open invoices"] });
  const f = cashForecast();
  const cash = cashOnHand();
  if (f[0].outflowPaise > cash) out.push({ level: "high", title: "Cash may not cover the next 30 days", why: `Cash is ${p(cash)} but commitments are about ${p(f[0].outflowPaise)}.`, go: ["banking", "Banking"] });
  const unmatched = state.bankTxns.filter((t) => t.status === "unmatched");
  if (unmatched.length) out.push({ level: "medium", title: `${unmatched.length} bank line${unmatched.length === 1 ? "" : "s"} unreconciled`, why: "Unmatched lines mean the books do not yet reflect your statement.", go: ["banking", "Reconcile"] });
  const filed = (state.taxFilings || []).find((x) => x.period === state.period);
  if (filed) { const delta = outputTaxPaise() - filed.taxPaise; if (delta !== 0) out.push({ level: "medium", title: "GST recorded as filed differs from the books", why: `Computed ${p(outputTaxPaise())} vs filed ${p(filed.taxPaise)} (difference ${p(Math.abs(delta))}).`, go: ["taxes", "Taxes"] }); }
  const prev = ymOffset(state.period, -1);
  const byVendorPrev = {};
  for (const e of state.expenses || []) if (e.date.slice(0, 7) === prev) byVendorPrev[e.vendorId || e.vendorName] = (byVendorPrev[e.vendorId || e.vendorName] || 0) + e.netPaise;
  for (const e of state.expenses || []) if (e.date.slice(0, 7) === state.period) {
    const key = e.vendorId || e.vendorName; const before = byVendorPrev[key] || 0;
    if (before > 0 && e.netPaise > before * 1.5) out.push({ level: "medium", title: `Unusual spending with ${e.vendorName}`, why: `${p(e.netPaise)} this month vs ${p(before)} last month for the same vendor.`, go: ["expenses", "Review"] });
  }
  const noReceipt = (state.expenses || []).filter((e) => !e.receipt && e.date.slice(0, 7) === state.period);
  if (noReceipt.length) out.push({ level: "low", title: `${noReceipt.length} expense${noReceipt.length === 1 ? "" : "s"} without a receipt`, why: `${p(noReceipt.reduce((a, e) => a + e.totalPaise, 0))} lacks supporting documents.`, go: ["expenses", "Expenses"] });
  const customerRev = {};
  for (const inv of state.invoices) { if (isVoid(inv) || inv.date.slice(0, 7) !== state.period) continue; customerRev[inv.clientName] = (customerRev[inv.clientName] || 0) + inv.totals.taxablePaise; }
  const total = Object.values(customerRev).reduce((a, x) => a + x, 0) || 1;
  const top = Object.entries(customerRev).sort((a, b) => b[1] - a[1])[0];
  if (top && top[1] / total >= 0.4) out.push({ level: "low", title: `Revenue concentrated in ${top[0]}`, why: `${top[0]} is ${Math.round((top[1] / total) * 100)}% of this month's revenue.`, go: ["insights", "Insights"] });
  const order = { high: 0, medium: 1, low: 2 };
  return out.sort((a, b) => order[a.level] - order[b.level]);
}

function viewAlerts() {
  const alerts = smartAlerts();
  const counts = { high: alerts.filter((a) => a.level === "high").length, medium: alerts.filter((a) => a.level === "medium").length, low: alerts.filter((a) => a.level === "low").length };
  const cls = { high: "b-urgent", medium: "b-warn", low: "b-muted" };
  return `
  <div class="grid kpi">${kpi("High priority", String(counts.high), counts.high ? "Act today" : "Nothing urgent")}${kpi("Worth a look", String(counts.medium), "This week")}${kpi("Minor", String(counts.low), "Housekeeping")}</div>
  <div class="card"><div class="card-h"><h2>Smart alerts</h2><span class="hint">Detected from your records</span></div>
    <div class="card-b" style="padding:0"><table><tbody>${alerts.map((a) => `<tr>
      <td style="width:70px"><span class="badge ${cls[a.level]}">${esc(a.level)}</span></td>
      <td><b>${esc(a.title)}</b><div class="subtle">${esc(a.why)}</div></td>
      <td><button class="btn sm" data-go="${esc(a.go[0])}">${esc(a.go[1])} &rarr;</button></td>
    </tr>`).join("") || `<tr><td colspan="3" class="empty">No alerts. Overdue, cash, reconciliation and spending all look calm.</td></tr>`}</tbody></table></div></div>
  <div class="card"><div class="card-b"><div class="subtle">Every alert is a rule over your own data and shows the reason it fired. Alerts are advisory: nothing is escalated or sent anywhere automatically.</div></div></div>`;
}

// --- Profitability: margins and period comparison --------------------------

function profitComparison() {
  const js = allJournals();
  const cur = profitAndLoss(js, state.coa, { from: state.period + "-01", to: state.period + "-31" });
  const prevPeriod = ymOffset(state.period, -1);
  const prev = profitAndLoss(js, state.coa, { from: prevPeriod + "-01", to: prevPeriod + "-31" });
  const pct = (now, before) => (before ? Math.round(((now - before) / Math.abs(before)) * 100) : null);
  const marginOf = (p, rev) => (rev > 0 ? Math.round((p / rev) * 100) : null);
  return {
    cur, prev, prevPeriod,
    revenueDeltaPct: pct(cur.revenuePaise, prev.revenuePaise),
    expenseDeltaPct: pct(cur.expensePaise + cur.cogsPaise, prev.expensePaise + prev.cogsPaise),
    profitDeltaPct: pct(cur.netProfitPaise, prev.netProfitPaise),
    grossMarginPct: marginOf(cur.grossProfitPaise, cur.revenuePaise),
    netMarginPct: marginOf(cur.netProfitPaise, cur.revenuePaise),
  };
}

function profitCompareHtml() {
  const c = profitComparison();
  const arrow = (v) => (v == null ? "no prior data" : `${v >= 0 ? "+" : ""}${v}% vs ${c.prevPeriod}`);
  const color = (v) => (v == null ? "var(--muted)" : v >= 0 ? "var(--good)" : "var(--urgent)");
  return `
  <div class="card"><div class="card-h"><h2>Margins &amp; comparison</h2><span class="hint">This month vs last (${esc(c.prevPeriod)})</span></div>
    <div class="card-b">
      <div class="grid kpi">
        ${kpi("Gross margin", c.grossMarginPct == null ? "-" : c.grossMarginPct + "%", "Gross profit / revenue")}
        ${kpi("Net margin", c.netMarginPct == null ? "-" : c.netMarginPct + "%", "Net profit / revenue")}
        ${kpi("Revenue change", p(c.cur.revenuePaise - c.prev.revenuePaise), arrow(c.revenueDeltaPct))}
        ${kpi("Profit change", p(c.cur.netProfitPaise - c.prev.netProfitPaise), arrow(c.profitDeltaPct))}
      </div>
      <table style="margin-top:12px"><thead><tr><th>Line</th><th class="num">This month</th><th class="num">Last month</th><th class="num">Change</th></tr></thead>
      <tbody>
        <tr><td>Revenue</td><td class="num">${p(c.cur.revenuePaise)}</td><td class="num">${p(c.prev.revenuePaise)}</td><td class="num" style="color:${color(c.revenueDeltaPct)}">${c.revenueDeltaPct == null ? "-" : (c.revenueDeltaPct >= 0 ? "+" : "") + c.revenueDeltaPct + "%"}</td></tr>
        <tr><td>Cost of services</td><td class="num">${p(c.cur.cogsPaise)}</td><td class="num">${p(c.prev.cogsPaise)}</td><td class="num"></td></tr>
        <tr><td>Operating expenses</td><td class="num">${p(c.cur.expensePaise)}</td><td class="num">${p(c.prev.expensePaise)}</td><td class="num" style="color:${color(c.expenseDeltaPct != null ? -c.expenseDeltaPct : null)}">${c.expenseDeltaPct == null ? "-" : (c.expenseDeltaPct >= 0 ? "+" : "") + c.expenseDeltaPct + "%"}</td></tr>
        <tr><td><b>Net profit</b></td><td class="num"><b>${p(c.cur.netProfitPaise)}</b></td><td class="num"><b>${p(c.prev.netProfitPaise)}</b></td><td class="num" style="color:${color(c.profitDeltaPct)}">${c.profitDeltaPct == null ? "-" : (c.profitDeltaPct >= 0 ? "+" : "") + c.profitDeltaPct + "%"}</td></tr>
      </tbody></table>
      <div class="subtle" style="margin-top:8px">Margins use this month's revenue as the denominator. Comparison is month over month; a period with no prior data shows "no prior data" rather than an invented baseline.</div>
    </div></div>`;
}

// --- HSN/SAC and tax-return summaries --------------------------------------

function hsnSummary() {
  const by = {};
  for (const inv of state.invoices) {
    if (isVoid(inv) || inv.date.slice(0, 7) !== state.period) continue;
    for (const li of inv.lineItems || []) {
      const key = (li.hsnSac || "unclassified") + " · " + (li.gstRate ?? 0) + "%";
      const taxable = asPaise(li.ratePaise || 0) * (li.qty ?? 1);
      (by[key] = by[key] || { hsnSac: li.hsnSac || "unclassified", gstRate: li.gstRate ?? 0, taxablePaise: 0, taxPaise: 0, count: 0 });
      by[key].taxablePaise += taxable; by[key].taxPaise += Math.round((taxable * (li.gstRate ?? 0)) / 100); by[key].count += 1;
    }
  }
  return Object.values(by).sort((a, b) => b.taxablePaise - a.taxablePaise);
}

function taxReturnSummary() {
  const outward = {};
  for (const inv of state.invoices) {
    if (isVoid(inv) || inv.date.slice(0, 7) !== state.period) continue;
    const rate = (inv.lineItems && inv.lineItems[0] && inv.lineItems[0].gstRate) ?? 0;
    (outward[rate] = outward[rate] || { taxablePaise: 0, taxPaise: 0, count: 0 });
    outward[rate].taxablePaise += inv.totals.taxablePaise; outward[rate].taxPaise += taxTotalOf(inv.totals); outward[rate].count += 1;
  }
  const inward = {};
  const addIn = (rate, taxable, tax, n) => { (inward[rate] = inward[rate] || { taxablePaise: 0, taxPaise: 0, count: 0 }); inward[rate].taxablePaise += taxable; inward[rate].taxPaise += tax; inward[rate].count += n; };
  for (const e of state.expenses || []) if (e.date.slice(0, 7) === state.period) addIn(e.gstRate ?? 0, e.netPaise, e.gstPaise, 1);
  for (const b of state.bills || []) if (b.date.slice(0, 7) === state.period) addIn(b.gstRate ?? 0, b.netPaise, b.gstPaise, 1);
  const sum = (o) => Object.values(o).reduce((a, x) => ({ taxablePaise: a.taxablePaise + x.taxablePaise, taxPaise: a.taxPaise + x.taxPaise }), { taxablePaise: 0, taxPaise: 0 });
  return { outward, inward, outwardTotal: sum(outward), inwardTotal: sum(inward) };
}

function viewReadout() {
  const inv = state.invoices.find((i) => i.number === "INV-2609-003") || state.invoices[0];
  const t = inv.totals;
  const li = inv.lineItems[0] || {};
  const qty = li.qty ?? 1;
  const rate = asPaise(li.ratePaise || 0);
  const gstRate = li.gstRate || 0;
  const tdsRate = t.tdsRate || 0;
  const taxAmount = t.totalTaxPaise ?? t.gstPaise;
  const componentTotal = isGstRegime() ? (t.interState ? t.igstPaise : t.cgstPaise + t.sgstPaise) : taxAmount;
  const asserted = componentTotal === taxAmount;
  const splitLine = t.interState
    ? `Inter-state supply, so the whole ${esc(taxNoun())} is a single <b>IGST</b> line: ${p(t.igstPaise)}.`
    : `Intra-state supply, so ${esc(taxNoun())} is split into <b>CGST ${p(t.cgstPaise)}</b> and <b>SGST ${p(t.sgstPaise)}</b>.`;

  const steps = [
    { title: "Work out the taxable value", body: `${qty} × ${p(rate)} = <b>${p(t.taxablePaise)}</b>.` },
    { title: `Apply ${esc(taxNoun())} at ${gstRate}%`, body: `${p(t.taxablePaise)} × ${gstRate}% = <b>${p(taxAmount)}</b>.` },
    ...(isGstRegime() ? [{ title: "Split it by place of supply", body: splitLine }] : []),
    { title: `Add ${esc(taxNoun())} to get the invoice total`, body: `${p(t.taxablePaise)} + ${p(taxAmount)} = <b>${p(t.totalPaise)}</b>.` },
    { title: `${isGstRegime() ? `Deduct TDS ${esc(inv.tdsSection || "none")}` : "Deduct withholding"} on the taxable value only`, body: `${p(t.taxablePaise)} × ${tdsRate}% = <b>${p(t.tdsPaise)}</b>. It does not include ${esc(taxNoun())}.` },
    { title: "What the client actually pays", body: `${p(t.totalPaise)} − ${p(t.tdsPaise)} = <b>${p(t.payablePaise)}</b>.` },
  ].map((s, i) => ({ ...s, n: i + 1 }));

  const fragRows = state.clients.map((c) => {
    const n = invoicesForClient(c.id).length;
    const r = clientRecommendation(c.id);
    return `<tr><td>${esc(c.name)}</td><td class="num">${n}</td><td><span class="badge ${r.level === "urgent" ? "b-urgent" : r.level === "warn" ? "b-warn" : "b-good"}">${esc(r.state.replace(/_/g, " "))}</span></td></tr>`;
  }).join("");

  return `
  <div class="card">
    <div class="card-h"><h2>Worked example · ${esc(inv.number)} (${esc(inv.clientName)})</h2><span class="hint">Plain-language calculation</span></div>
    <div class="card-b grid">
      ${steps.map((s) => `<div class="step done"><div class="dot">${s.n}</div><div><b>${s.title}</b><div class="subtle">${s.body}</div></div></div>`).join("")}
      <div class="${asserted ? "okline" : "flag"}">
        ${isGstRegime()
          ? `Paise check: ${t.interState ? `IGST ${p(t.igstPaise)}` : `CGST ${p(t.cgstPaise)} + SGST ${p(t.sgstPaise)} = ${p(t.cgstPaise + t.sgstPaise)}`}, and total ${esc(taxNoun())} is ${p(taxAmount)}.`
          : `Tax check: the single ${esc(taxNoun())} line is ${p(taxAmount)}.`}
        <b>${asserted ? "They match exactly." : "They do not match - this would be a bug."}</b>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-h"><h2>The rules in plain language</h2><span class="hint">What the engine enforces</span></div>
    <div class="card-b grid two">
      <div class="grid">
        <div class="step"><div class="dot">${esc(CURRENCIES[state.settings.currency]?.symbol || "$")}</div><div><b>Exact money</b><div class="subtle">Every amount is stored as integer minor units. Nothing is a floating-point number, so 0.1 + 0.2 never drifts.</div></div></div>
        <div class="step"><div class="dot">G</div><div><b>${esc(taxNoun())} splitting</b><div class="subtle">${isGstRegime() ? "Intra-state supply splits GST equally into CGST and SGST. Inter-state is a single IGST line. CGST + SGST always re-adds to the total GST, to the paise." : `This regime applies a single ${esc(taxNoun())} line per invoice; the total is exact to the minor unit.`}</div></div></div>
        <div class="step"><div class="dot">T</div><div><b>${isGstRegime() ? "TDS" : "Withholding"}</b><div class="subtle">${isGstRegime() ? `TDS is computed on the taxable value, excluding GST.` : `Withholding is computed on the taxable value, excluding ${esc(taxNoun())}.`} Picking a section reveals only the fields that section requires, and saving is blocked until they are filled.</div></div></div>
      </div>
      <div class="grid">
        <div class="step"><div class="dot">F</div><div><b>Fragmentation thresholds</b><div class="subtle">1 invoice = optimized. 2 = acceptable. 3-4 = proactive consolidation. 5 or more = urgent consolidation. The recommendation is per client, per period.</div></div></div>
        <div class="step"><div class="dot">A</div><div><b>Asymmetry</b><div class="subtle">Bank credit + TDS credit must reconstruct the invoice total. Any gap is flagged, down to a single paise, with the reason.</div></div></div>
        <div class="step"><div class="dot">C</div><div><b>Coverage-aware accrual</b><div class="subtle">Fixed-fee research revenue is recognized only up to the milestones with documentary evidence, and deferred below the coverage threshold.</div></div></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-h"><h2>Fragmentation readout · ${state.period}</h2><span class="hint">Live state per client</span></div>
    <div class="card-b" style="padding:0">
      <table><thead><tr><th>Client</th><th class="num">Invoices</th><th>State</th></tr></thead><tbody>${fragRows}</tbody></table>
    </div>
  </div>`;
}

function viewAccuracy() {
  const r = regime();
  const verified = [
    ["Exact money", "Amounts are integer minor units. No floating point is used anywhere in the money path."],
    ["Tax split", "Intra-state GST splits into CGST + SGST that always re-add to the total tax; inter-state is one IGST line. Single-tax regimes produce one line."],
    ["Discounts", "A discount reduces the taxable value before tax, allocated across lines with no rounding loss."],
    ["TDS (India)", "Computed on the taxable value excluding GST, with optional annual/single thresholds and the higher rate when no PAN is on file."],
    ["Reconciliation", "All payments for an invoice are aggregated: bank credit + tax withheld must reconstruct the invoice total."],
    ["Credit notes", "Reduce revenue, tax and receivable, and keep the ledger balanced."],
    ["Coverage-aware accrual", "Fixed-fee revenue is recognised only up to evidenced milestones; the rest is deferred."],
    ["Ledger balance", "Debits always equal credits across invoices, payments and credit notes."],
  ];
  const notCovered = [
    "Filing, e-invoicing or government portal submission of any kind.",
    "Party master validation against a tax authority (we check format and checksum only).",
    "Reverse charge, exemptions, zero-rating and cross-border place-of-supply rules.",
    "Payroll, inventory, fixed assets, bank feeds or actual bank reconciliation.",
    "Multi-user permissions, approval chains, or an immutable audit trail.",
    "Tax advice: rates and rules change and are not legal advice.",
  ];
  return `
  <div class="card">
    <div class="card-h"><h2>What this tool computes, and how</h2><span class="hint">Each item is covered by an automated test</span></div>
    <div class="card-b grid two">
      <div class="grid">${verified.map(([t, d]) => `<div class="step done"><div class="dot">✓</div><div><b>${esc(t)}</b><div class="subtle">${esc(d)}</div></div></div>`).join("")}</div>
      <div class="grid">
        <div class="reco good" style="color:var(--good)"><h3 style="color:var(--ink)">Current regime</h3><p style="color:#374151">${esc(r.label)}</p>
          <table style="margin-top:8px"><tbody>
            <tr><td>Tax name</td><td class="num">${esc(isGstRegime() ? "GST (CGST/SGST/IGST)" : r.taxName)}</td></tr>
            <tr><td>Registration label</td><td class="num">${esc(r.idLabel)}</td></tr>
            <tr><td>Standard rates</td><td class="num">${(r.rates || []).map((x) => x + "%").join(", ")}</td></tr>
            <tr><td>Place of supply</td><td class="num">${r.placeOfSupply ? "Yes" : "No"}</td></tr>
            <tr><td>Currency</td><td class="num">${esc(CURRENCIES[state.settings.currency]?.code || "")}</td></tr>
          </tbody></table>
        </div>
        <div class="flag" style="border-color:#f3e0c7;background:#fff8f0;color:#7a4e12"><b>Not covered</b>
          <ul style="margin:6px 0 0;padding-left:18px">${notCovered.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
        </div>
      </div>
    </div>
  </div>
  <div class="card"><div class="card-b"><div class="caveat"><b>Regulatory accuracy notes</b><ul>${REGULATORY_CAVEATS.map((c) => `<li>${esc(c)}</li>`).join("")}</ul></div></div></div>`;
}

  const drs = el("dashReset"); if (drs) drs.onclick = resetDemo;
  const obd = el("ob_dismiss"); if (obd) obd.onclick = () => { state.ui.onboardingDismissed = true; saveState(); render(); };
  const bf = el("balFilter"); if (bf) bf.onchange = (e) => { state.balanceClient = e.target.value; render(); };
  const lf = el("ledFilter"); if (lf) lf.onchange = (e) => { state.ledgerClient = e.target.value; render(); };
  const ldt = el("ledgerDetailToggle"); if (ldt) ldt.onclick = () => { state.ui.ledgerDetail = !state.ui.ledgerDetail; render(); };

  const cx = el("closeExport"); if (cx) cx.onclick = exportLedgerCsv;

  const pc = el("periodClose"); if (pc) pc.onclick = () => closePeriod(state.period, { hard: state.settings.hardLock === true });
  const pov = el("periodOverride"); if (pov) pov.onclick = () => openOverrideClose(state.period);
  const pr = el("periodReopen"); if (pr) pr.onclick = () => reopenPeriod(state.period);
  const uh = el("upgradeHardLock"); if (uh) uh.onclick = () => { const l = periodLock(state.period); if (l) l.hard = true; logActivity("period.lock", state.period); saveState(); render(); toast(`${state.period} is now hard-locked`, "ok"); };
  const ye = el("yearEndClose"); if (ye) ye.onclick = () => yearEndClose(state.period);
  document.querySelectorAll("input[data-cm]").forEach((cb) => {
    cb.onchange = () => {
      const cm = state.commitments.find((x) => x.id === cb.dataset.cm);
      cm.milestones[Number(cb.dataset.mi)].evidence = cb.checked;
      render();
    };
  });

  document.querySelectorAll("[data-plan]").forEach((b) => {
    b.onclick = () => {
      state.settings.plan = b.dataset.plan;
      saveState(); render();
      toast(`Plan set to ${PLANS.find((x) => x.id === b.dataset.plan).name}. No payment taken.`);
    };
  });

  const reg = el("s_regime");
  if (reg) {
    reg.onchange = (e) => {
      state.settings.regimeId = e.target.value;
      state.settings.currency = TAX_REGIMES[e.target.value]?.currency || state.settings.currency;
      saveState(); render();
    };
  }
  const sv = el("s_save");
  if (sv) {
    sv.onclick = () => {
      state.company.name = el("s_name").value.trim() || state.company.name;
      state.company.upiId = el("s_upi").value.trim();
      state.company.gstin = el("s_taxid").value.trim().toUpperCase();

      state.settings.baseCurrency = el("s_baseCurrency")?.value || state.settings.currency;

function openBankAccountModal() {
  if (!can("write")) return toast("Read-only role: you cannot change ledger data", "err");
  const close = openDrawer("Add bank account", `
    <div class="field"><label class="f">Account name</label><input id="bk_name" placeholder="e.g. Current account"></div>
    <div class="field"><label class="f">Bank</label><input id="bk_bank" placeholder="e.g. HDFC Bank"></div>
    <div class="field"><label class="f">Masked number</label><input id="bk_num" placeholder="XXXX 1234"></div>
    <div class="field"><label class="f">Opening balance (${esc(state.settings.currency)})</label><input id="bk_open" value="0"></div>
    <div class="field"><label class="f">Opening date</label><input id="bk_date" type="date" value="${state.period}-01"></div>
    <div class="subtle">The opening balance posts to bank against owner's equity so the ledger stays balanced.</div>`,
    `<button class="btn" id="bk_cancel">Cancel</button><button class="btn primary" id="bk_save">Add account</button>`);
  el("bk_cancel").onclick = close;
  el("bk_save").onclick = () => {

    const openingPaise = toPaise(el("bk_open").value || 0);
    const id = newId("bank");

    saveState(); close(); render(); toast("Bank account added", "ok");
  };
}

  if (!can("write")) return toast("Read-only role: you cannot change ledger data", "err");

  draft = {
    clientId: state.clients[0].id, date: todayISO, dueDate: addDays(todayISO, state.clients[0].terms || 15), description: "",
    qty: 1, rateRupees: "", gstRate: rates.includes(18) ? 18 : rates[rates.length - 1],
    tdsSection: "", tdsCapture: {}, lineItems: [], errors: {},
    taxTreatment: "standard", docCurrency: state.settings.currency, fxRate: "",
  };
  renderInvoiceModal();
}

function draftClient() { return client(draft.clientId); }

function computeDraft() {
  const effRate = (draft.taxTreatment || "standard") === "standard" ? draft.gstRate : 0;
  const lines = draft.lineItems.length ? draft.lineItems : (draft.rateRupees ? [{ description: draft.description, qty: draft.qty, ratePaise: toPaise(draft.rateRupees), gstRate: effRate }] : []);
  return computeInvoiceTotals({
    supplierState: state.company.state,
    placeOfSupply: draftClient()?.state,
    regimeId: state.settings.regimeId,
    tdsSection: draft.tdsSection || undefined,
    lineItems: lines,
  });
}

function viewRecommendationPreview() {
  const clientId = draft.clientId;
  const existing = invoicesForClient(clientId);
  const projectedCount = existing.length + 1;
  const all = existing.map((i) => i.totals.totalPaise).concat([computeDraft().totalPaise]);
  const avg = Math.round(all.reduce((a, b) => a + b, 0) / all.length);
  const r = recommendFragmentation({ invoiceCount: projectedCount, avgInvoicePaise: avg, role: state.role, clientName: draftClient()?.name || "client" });
  const cls = r.level === "urgent" ? "urgent" : r.level === "warn" ? "warn" : r.level === "good" ? "good" : "";
  return `<div class="reco ${cls}" style="color:${r.level === "urgent" ? "var(--urgent)" : r.level === "warn" ? "var(--warn)" : "var(--good)"}">
    <h3 style="color:var(--ink)">Projected: ${esc(r.title)}</h3>
    <p style="color:#374151">Saving this makes ${projectedCount} invoices for ${esc(draftClient()?.name || "")} this period. ${esc(r.reason)}</p>
    <div class="advice">${esc(r.roleAdvice)}</div>
  </div>`;
}

function saveDraft() {
  const c = draftClient();
  if (!c) return toast("Pick a client", "err");
  if (!guardPeriod(draft.date, "Invoice")) return;
  const g = c.gstin ? validateTaxId(c.gstin, state.settings.regimeId) : { valid: true };
  if (!g.valid) return toast(`Client ${idNoun()} is invalid: ` + g.reason, "err");
  if (draft.tdsSection) {
    const check = validateTdsCapture({ tdsSection: draft.tdsSection, tdsCapture: draft.tdsCapture });
    if (!check.complete) return toast("TDS capture incomplete: " + check.missing.join(", "), "err");
  }
  const lines = draft.rateRupees
    ? [{ description: draft.description || "Services", qty: draft.qty, ratePaise: toPaise(draft.rateRupees), gstRate: (draft.taxTreatment || "standard") === "standard" ? draft.gstRate : 0, hsnSac: "998314" }]
    : [];
  if (!lines.length) return toast("Enter a rate for the line item", "err");

  const totals = computeInvoiceTotals({ supplierState: state.company.state, placeOfSupply: c.state, regimeId: state.settings.regimeId, tdsSection: draft.tdsSection || undefined, lineItems: lines });
  const number = `INV-${state.period.replace("-", "").slice(2)}-${String(state.nextInvoiceSeq++).padStart(3, "0")}`;
  const inv = addInvoice({
    id: newId("inv"), number, clientId: c.id, clientName: c.name, date: draft.date,
    dueDate: draft.dueDate || addDays(draft.date, c.terms || 15), description: lines[0].description,
    supplierState: state.company.state, placeOfSupply: c.state, lineItems: lines,
    tdsSection: draft.tdsSection || "", tdsCapture: { ...draft.tdsCapture }, totals, preview: true, status: "draft",
    currency: draft.docCurrency || state.settings.currency, fxRate: draft.fxRate || "", taxTreatment: draft.taxTreatment || "standard",
  });
  recordChange("invoice.create", `${number} · ${c.name}`, null, inv);
  closeModal();
  const reco = clientRecommendation(c.id);
  toast(`${number} saved · ${c.name} now has ${invoicesForClient(c.id).length} invoices`, "ok");
  if (reco.level === "urgent") toast(`Urgent: consolidate ${c.name} now - 5+ invoices this period`, "err");
  if (state.view === "invoices" || state.view === "dashboard") render(); else { state.view = "invoices"; render(); }
}

}

// ---- CSV import -----------------------------------------------------------

function parseCsv(text) {
  return String(text).trim().split(/\r?\n/).filter((l) => l.trim()).map((line) => {
    const out = []; let cur = "", q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
      else if (ch === '"') q = true;
      else if (ch === ",") { out.push(cur.trim()); cur = ""; }
      else cur += ch;
    }
    out.push(cur.trim());
    return out;
  });
}

function importCsvRows(type, text) {
  const rows = parseCsv(text);
  if (!rows.length) return { imported: 0, errors: ["No rows found"] };
  const HEAD = new Set(["number", "invoice", "invoice number", "client", "client name", "date", "description", "amount", "taxable", "rate", "tax rate", "tds", "tds section", "method", "reference", "bank credit", "withheld"]);
  const isHeader = rows[0].some((c) => HEAD.has(String(c).toLowerCase()));
  const body = isHeader ? rows.slice(1) : rows;
  const errors = []; let imported = 0;
  if (type === "payments") {
    for (const r of body) {
      const [invoiceNumber, date, amount, tds, method, reference] = r;
      const inv = state.invoices.find((i) => i.number === invoiceNumber);
      if (!inv) { errors.push(`Unknown invoice ${invoiceNumber || "(blank)"}`); continue; }
      state.payments.push({ id: newId("pay"), clientId: inv.clientId, invoiceId: inv.id, invoiceNumber: inv.number, date: date || todayISO, amountPaise: toPaise(amount || 0), tdsDeductedPaise: toPaise(tds || 0), method: method || "", reference: reference || "" });
      if (openBalance(inv) === 0) inv.status = "paid";
      imported++;
    }
  } else {
    if (blockIssueIfNotReady()) return { imported: 0, errors: ["Confirm your tax profile before importing invoices"] };
    for (const r of body) {
      const [number, clientName, date, description, taxable, rate, tdsSection] = r;
      if (!clientName || !taxable) { errors.push(`Skipped row (need client and amount): ${r.join(", ")}`); continue; }
      let c = state.clients.find((x) => x.name.toLowerCase() === String(clientName).toLowerCase());
      if (!c) { c = { id: newId("c"), name: clientName, gstin: "", state: "", type: "business" }; state.clients.push(c); }
      const lines = [{ description: description || "Imported line", qty: 1, ratePaise: toPaise(taxable), gstRate: Number(rate || 0), hsnSac: "" }];
      const totals = computeInvoiceTotals({ supplierState: state.company.state, placeOfSupply: c.state, regimeId: state.settings.regimeId, tdsSection: tdsSection || undefined, lineItems: lines });
      state.invoices.push({
        id: newId("inv"), number: number || `INV-IMP-${state.nextInvoiceSeq++}`, clientId: c.id, clientName: c.name,
        date: date || todayISO, dueDate: addDays(date || todayISO, 15), description: description || "Imported line",
        supplierState: state.company.state, placeOfSupply: c.state, lineItems: lines,
        tdsSection: tdsSection || "", tdsCapture: {}, totals, preview: true, status: "issued",
      });
      imported++;
    }
  }
  if (imported) { logActivity("import.csv", `${type}: ${imported} rows`); saveState(); }
  return { imported, errors };
}

function openImportCsv() {
  const close = openDrawer("Import CSV", `
    <div class="field"><label class="f">What are you importing?</label>
      <select id="im_type"><option value="invoices">Invoices</option><option value="payments">Payments</option></select></div>
    <div class="field"><label class="f">Paste CSV</label>

    <div class="subtle" id="im_help">Invoices: number, client, date, description, taxable, tax rate %, TDS section. Payments: invoice number, date, bank credit, withheld, method, reference. A header row is optional.</div>
    <div id="im_result"></div>`, `<button class="btn" id="im_cancel">Cancel</button><button class="btn primary" id="im_go">Import</button>`);
  el("im_cancel").onclick = close;
  el("im_go").onclick = () => {
    const res = importCsvRows(el("im_type").value, el("im_text").value);
    el("im_result").innerHTML = `<div class="${res.errors.length ? "flag" : "okline"}">Imported ${res.imported} row${res.imported === 1 ? "" : "s"}.${res.errors.length ? " " + res.errors.length + " skipped: " + res.errors.slice(0, 3).map(esc).join("; ") : ""}</div>`;
    if (res.imported) render();
  };
}
